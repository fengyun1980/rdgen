name: Upload artifacts to File Browser
description: >
  Mirror build artifacts into a File Browser instance. Credentials come from
  repository secrets and are never written into workflow files. Non-fatal by
  design: a mirror failure must not fail a build that already succeeded.

inputs:
  fb-url:
    description: Base URL, e.g. http://f.example.com:8880
    required: false
    default: ''
  fb-user:
    description: File Browser username
    required: false
    default: ''
  fb-pass:
    description: File Browser password
    required: false
    default: ''
  fb-dir:
    description: Target directory inside File Browser
    required: false
    default: '/Software/RustDesk'
  files:
    description: >
      Newline-separated list of file paths (relative to the workspace or absolute).
      Missing files are skipped with a message.
    required: true

runs:
  using: composite
  steps:
    - name: Upload
      shell: bash
      env:
        FB_URL: ${{ inputs.fb-url }}
        FB_USER: ${{ inputs.fb-user }}
        FB_PASS: ${{ inputs.fb-pass }}
        FB_DIR: ${{ inputs.fb-dir }}
        FILES: ${{ inputs.files }}
      run: |
        set -u
        if [ -z "${FB_URL:-}" ]; then
          echo "FB_URL not configured; skip mirror."
          exit 0
        fi
        BASE="${FB_URL%/}"
        TOKEN=$(curl -fsS -X POST "$BASE/api/login" \
          -H 'Content-Type: application/json' \
          -d "{\"username\":\"$FB_USER\",\"password\":\"$FB_PASS\"}" \
          | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
        if [ -z "${TOKEN:-}" ]; then
          echo "::error::File Browser login failed (no token). Check FB_USER / FB_PASS."
          exit 1
        fi
        DIR="${FB_DIR:-/Software/RustDesk}"
        # Read the file list via a here-string (no pipe) so the loop body runs in
        # the current shell; with `echo | while` the whole loop is a subshell and
        # its counters would be lost.
        ok_count=0
        fail_count=0
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          # tolerate leading/trailing whitespace from YAML block scalars
          f=$(printf '%s' "$f" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          [ -n "$f" ] || continue
          if [ ! -f "$f" ]; then
            echo "skip (missing): $f"
            continue
          fi
          NAME=$(basename "$f")
          # --retry re-sends the WHOLE file, so keep it to one retry: with four
          # ~40MB artifacts a 3x retry could burn 40+ minutes re-uploading.
          # 300s is generous for a single artifact (observed ~1-2 min).
          code=$(curl -sS -o /tmp/fb_resp.txt -w '%{http_code}' -X POST \
            "$BASE/api/resources${DIR}%2F${NAME}?override=true" \
            -H "X-Auth: $TOKEN" \
            -H "X-Forwarded-For: 127.0.0.1" \
            --connect-timeout 15 --max-time 300 \
            --retry 1 --retry-delay 5 \
            -F "file=@${f}" 2>/dev/null || echo "000")
          echo "upload $NAME -> HTTP $code"
          cat /tmp/fb_resp.txt 2>/dev/null || true
          case "$code" in
            200|201) ok_count=$((ok_count + 1)) ;;
            *) fail_count=$((fail_count + 1))
               echo "::warning::$NAME upload returned HTTP $code" ;;
          esac
        done <<< "$FILES"
        echo "mirror summary: $ok_count uploaded, $fail_count failed"