name: Report build status
description: >
  POST a status update to the rdgen server. Centralised so the token wiring and
  the "Success" sentinel live in exactly one place; the server shows the download
  page only when (status or "").lower() == "success".

inputs:
  status-url:
    description: Full URL of the /updategh endpoint
    required: true
  token:
    description: Shared CALLBACK_TOKEN secret
    required: false
    default: ''
  uuid:
    description: Build request UUID
    required: true
  status:
    description: Status text shown on the waiting page. Use "Success" on completion.
    required: true

runs:
  using: composite
  steps:
    - name: POST status
      shell: bash
      env:
        URL: ${{ inputs.status-url }}
        TOKEN: ${{ inputs.token }}
        UUID: ${{ inputs.uuid }}
        STATUS: ${{ inputs.status }}
      run: |
        set -u
        if [ -z "${URL:-}" ]; then
          echo "::warning::status-url is empty; skipping status report"
          exit 0
        fi

        # Build the JSON body with sed only. No python dependency: the Windows
        # and macOS runners do not guarantee `python` on PATH, and these
        # workflows never call actions/setup-python, so a python-based encoder
        # would fail the step on those platforms.
        json_escape() {
          printf '%s' "$1" \
            | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' \
                  -e 's/\t/\\t/g' -e 's/\r/\\r/g' \
            | awk 'BEGIN{ORS=""} {if (NR>1) printf "\\n"; print}'
        }
        BODY=$(printf '{"uuid":"%s","status":"%s"}' \
                 "$(json_escape "${UUID}")" "$(json_escape "${STATUS}")")

        # Keep this cheap. A status ping is informational; it must never add minutes
        # to a build. Worst case here is 3 x 8s + 2 x 2s = 28s per call, and with
        # ~11 calls that is still bounded, whereas the old settings (max-time 30,
        # retry 3) allowed ~126s per call -> up to 23 minutes of dead waiting if
        # the server was unreachable.
        code=$(curl -sS -o /tmp/status_resp.txt -w '%{http_code}' \
          -X POST "$URL" \
          -H 'Content-Type: application/json' \
          -H "Authorization: Bearer ${TOKEN:-}" \
          --connect-timeout 5 --max-time 8 \
          --retry 2 --retry-delay 2 --retry-max-time 25 \
          -d "$BODY" 2>/dev/null || echo "000")
        echo "status report -> HTTP $code (status=${STATUS})"
        cat /tmp/status_resp.txt 2>/dev/null || true
        # Never fail the job because a status ping failed; the build outcome is
        # what matters, and a 403 here would otherwise mask a successful build.
        if [ "$code" != "200" ]; then
          echo "::warning::status report returned HTTP $code"
        fi