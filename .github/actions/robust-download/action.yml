name: Robust download
description: >
  Download a URL with retries, backoff, resume and integrity checks.

  GitHub Releases returns intermittent 504s for large files (observed: 6/6 for
  LLVM-15.0.6-win64.exe, 2/4 for vcpkg.exe). The stock installers used here
  (bootstrap-vcpkg.bat, install-llvm-action) retry only 1-2 times and then abort
  the whole build, so a transient CDN hiccup kills an otherwise healthy run.

  This action is meant to PRE-SEED the file so the upstream installer finds it
  already present and skips its own download.

inputs:
  url:
    description: Source URL
    required: true
  dest:
    description: Destination file path
    required: true
  min-bytes:
    description: >
      Minimum acceptable size. Guards against an HTML error page saved with a
      200 status (observed from a mirror) poisoning the cache.
    required: false
    default: '1024'
  attempts:
    description: Number of attempts
    required: false
    default: '8'
  expect-magic:
    description: >
      Optional two-character magic prefix the file must start with, e.g. "PK"
      for zip-based files or "MZ" for Windows executables. Empty disables it.
    required: false
    default: ''
  fail-on-error:
    description: >
      When true, exhaust all attempts and fail the step. When false (default),
      warn and exit 0 so a caller can fall back to its own download path.
    required: false
    default: 'false'

outputs:
  downloaded:
    description: "'true' when the file is present and validated"
    value: ${{ steps.dl.outputs.downloaded }}

runs:
  using: composite
  steps:
    - name: Download with retries
      id: dl
      shell: bash
      env:
        URL: ${{ inputs.url }}
        DEST: ${{ inputs.dest }}
        MIN_BYTES: ${{ inputs.min-bytes }}
        ATTEMPTS: ${{ inputs.attempts }}
        EXPECT_MAGIC: ${{ inputs.expect-magic }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -u
        mkdir -p "$(dirname "$DEST")"
        echo "downloaded=false" >> "$GITHUB_OUTPUT"

        if [ -f "$DEST" ]; then
          size=$(wc -c <"$DEST" 2>/dev/null || echo 0)
          if [ "$size" -ge "$MIN_BYTES" ]; then
            echo "already present: $DEST ($size bytes)"
            echo "downloaded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f "$DEST"
        fi

        attempt=1
        delay=5
        while [ "$attempt" -le "$ATTEMPTS" ]; do
          echo "attempt $attempt/$ATTEMPTS -> $URL"
          # -C - resumes a partial file; a fresh attempt after a 5xx starts over
          # because the server may have sent an error body we already discarded.
          rm -f "$DEST.part"
          if curl -fL --retry 2 --retry-delay 3 --retry-all-errors \
                 --connect-timeout 30 --max-time 1800 \
                 -o "$DEST.part" "$URL"; then
            size=$(wc -c <"$DEST.part" 2>/dev/null || echo 0)
            ok=1
            if [ "$size" -lt "$MIN_BYTES" ]; then
              echo "  too small ($size < $MIN_BYTES), discarding"
              ok=0
            fi
            if [ "$ok" = "1" ] && [ -n "${EXPECT_MAGIC:-}" ]; then
              magic=$(head -c2 "$DEST.part")
              if [ "$magic" != "$EXPECT_MAGIC" ]; then
                echo "  wrong magic ('$magic' != '$EXPECT_MAGIC'), discarding"
                ok=0
              fi
            fi
            if [ "$ok" = "1" ]; then
              mv "$DEST.part" "$DEST"
              echo "downloaded ok: $size bytes"
              echo "downloaded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -f "$DEST.part"
          else
            echo "  curl failed (exit $?)"
            rm -f "$DEST.part"
          fi
          attempt=$((attempt + 1))
          [ "$attempt" -le "$ATTEMPTS" ] || break
          echo "  waiting ${delay}s before retry"
          sleep "$delay"
          # exponential backoff, capped
          delay=$(( delay * 2 ))
          [ "$delay" -le 60 ] || delay=60
        done

        if [ "${FAIL_ON_ERROR:-false}" = "true" ]; then
          echo "::error::download failed after $ATTEMPTS attempts: $URL"
          exit 1
        fi
        echo "::warning::download failed after $ATTEMPTS attempts: $URL"
        echo "::warning::leaving it to the caller / upstream installer to retry"
        exit 0