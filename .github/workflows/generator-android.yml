name: Custom Android Client Generator
run-name: Custom Android Client Generator · ${{ inputs.appname }} (${{ fromJson(inputs.extras).version }})
true:
  workflow_dispatch:
    inputs:
      server:
        description: Rendezvous Server
        required: true
        default: ''
        type: string
      key:
        description: Public Key
        required: true
        default: ''
        type: string
      apiServer:
        description: API Server
        required: true
        default: ''
        type: string
      custom:
        description: Custom JSON (base64)
        required: true
        default: ''
        type: string
      uuid:
        description: uuid of request
        required: true
        default: ''
        type: string
      iconlink:
        description: icon link
        required: false
        default: 'false'
        type: string
      logolink:
        description: logo link
        required: false
        default: 'false'
        type: string
      appname:
        description: app name
        required: true
        default: rustdesk
        type: string
      filename:
        description: Filename
        required: true
        default: rustdesk
        type: string
      extras:
        description: extra inputs in json
        required: true
        default: '{}'
        type: string
permissions:
  contents: read
concurrency:
  group: rdgen-${{ inputs.uuid }}
  cancel-in-progress: false
env:
  GENURL: ${{ secrets.GENURL }}
  CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
  FB_URL: ${{ secrets.FB_URL }}
  FB_USER: ${{ secrets.FB_USER }}
  FB_PASS: ${{ secrets.FB_PASS }}
  FB_DIR: ${{ vars.FB_DIR }}
  API_SERVER: ${{ inputs.apiServer }}
jobs:
  bridge:
    name: Prepare shared bridge artifacts
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ fromJson(inputs.extras).version }}
  build:
    name: Custom Android Client Generator
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: armv7
          target: armv7-linux-androideabi
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: x86_64
          target: x86_64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
    steps:
    - name: Load rdgen action definitions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        path: .rdgen
        sparse-checkout: .github/actions .github/patches
        sparse-checkout-cone-mode: false
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v6
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Set rdgen value
      if: ${{ fromJson(inputs.extras).rdgen == 'true' }}
      run: 'echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $GITHUB_ENV

        '
    - name: Set rdgen value
      if: ${{ fromJson(inputs.extras).rdgen == 'false' }}
      run: 'echo "STATUS_URL=${{ inputs.apiServer }}/api/updategh" >> $GITHUB_ENV

        '
    - name: Building · 5%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '5'
        label: Building
      continue-on-error: true
    - name: Install dependencies
      run: "sudo apt-get update\nsudo apt-get install -y \\\n     clang \\\n     cmake \\\n     curl \\\n     gcc-multilib \\\n     git \\\n     g++ \\\n     g++-multilib \\\n     imagemagick \\\n     libayatana-appindicator3-dev \\\n     libasound2-dev \\\n     libc6-dev \\\n     libclang-dev \\\n     libgstreamer1.0-dev \\\n     libgstreamer-plugins-base1.0-dev \\\n     libgtk-3-dev \\\n     libpam0g-dev \\\n     libpulse-dev \\\n     libva-dev \\\n     libvdpau-dev \\\n     libxcb-randr0-dev \\\n     libxcb-shape0-dev \\\n     libxcb-xfixes0-dev \\\n     libxdo-dev \\\n     libxfixes-dev \\\n     llvm-dev \\\n     nasm \\\n     ninja-build \\\n     openjdk-17-jdk-headless \\\n     pkg-config \\\n     tree \\\n     wget\n"
    - name: Checkout source code
      if: ${{ env.VERSION != 'master' }}
      uses: actions/checkout@v4
      with:
        repository: rustdesk/rustdesk
        ref: refs/tags/${{ env.VERSION }}
        submodules: recursive
    - name: Checkout source code
      if: ${{ env.VERSION == 'master' }}
      uses: actions/checkout@v4
      with:
        repository: rustdesk/rustdesk
        submodules: recursive
    - name: Install flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
    - name: Patch flutter
      continue-on-error: true
      run: 'cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]] && git apply ${{ github.workspace }}/.rdgen/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Building · 15%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '15'
        label: Building
      continue-on-error: true
    - name: Install vcpkg dependencies
      run: "case ${{ matrix.job.target }} in\n  aarch64-linux-android)\n  ANDROID_TARGET=arm64-v8a\n  ;;\n  armv7-linux-androideabi)\n    ANDROID_TARGET=armeabi-v7a\n  ;;\n  x86_64-linux-android)\n    ANDROID_TARGET=x86_64\n  ;;\n  i686-linux-android)\n    ANDROID_TARGET=x86\n  ;;\nesac\nif ! ./flutter/build_android_deps.sh \"${ANDROID_TARGET}\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\n"
      shell: bash
    - name: Restore bridge files
      uses: actions/download-artifact@v4
      with:
        name: bridge-artifact
        path: ./
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: rustdesk-lib-cache-android
        key: ${{ matrix.job.target }}
    - name: icon stuff
      if: ${{ inputs.iconlink != 'false' }}
      continue-on-error: true
      shell: bash
      run: 'mv ./res/icon.ico ./res/icon.ico.bak

        mv ./res/icon.png ./res/icon.png.bak

        mv ./res/tray-icon.ico ./res/tray-icon.ico.bak

        wget -O ./res/icon.png ${{ fromJson(inputs.iconlink).url }}/get_png?filename=${{ fromJson(inputs.iconlink).file }}"&"uuid=${{ fromJson(inputs.iconlink).uuid }}

        mv ./res/32x32.png ./res/32x32.png.bak

        mv ./res/64x64.png ./res/64x64.png.bak

        mv ./res/128x128.png ./res/128x128.png.bak

        mv ./res/128x128@2x.png ./res/128x128@2x.png.bak

        convert ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico

        convert ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/tray-icon.ico

        cp ./res/icon.ico ./res/tray-icon.ico

        convert ./res/icon.png -resize 32x32 ./res/32x32.png

        convert ./res/icon.png -resize 64x64 ./res/64x64.png

        convert ./res/icon.png -resize 128x128 ./res/128x128.png

        convert ./res/128x128.png -resize 200% ./res/128x128@2x.png

        cp ./src/ui.rs ./src/ui.rs.bak

        b64=$(base64 < ./res/icon.png)

        sed -i -e ''s||$(echo
        "$b64")|'' ./src/ui.rs

        b64=""

        sed -i ''/android: true/a \ \ adaptive_icon_background: "#ffffff"'' ./flutter/pubspec.yaml

        sed -i ''/adaptive_icon_background/a \ \ adaptive_icon_foreground: "../res/icon.png"'' ./flutter/pubspec.yaml

        sed -i ''/adaptive_icon_foreground:/a \ \ adaptive_icon_foreground_inset: 32'' ./flutter/pubspec.yaml

        sed -i ''/ic_launcher_background/d'' ./flutter/android/app/src/main/res/values/colors.xml

        '
    - name: set server, key, and apiserver
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|rs-ny.rustdesk.com|${{ inputs.server }}|'' ./libs/hbb_common/src/config.rs

        sed -i -e ''s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ inputs.key }}|'' ./libs/hbb_common/src/config.rs

        sed -i -e ''s|https://admin.rustdesk.com|${{ inputs.apiServer }}|'' ./src/common.rs

        # ./flutter/pubspec.yaml

        #sed -i ''/intl:/a \ \ archive: ^3.6.1'' ./flutter/pubspec.yaml

        '
    - name: change appname to custom
      if: inputs.appname != 'rustdesk'
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|description = "RustDesk Remote Desktop"|description = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|ProductName = "RustDesk"|ProductName = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ inputs.appname }}.exe"|'' ./Cargo.toml

        sed -i ''s|name = "RustDesk"|name = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|description = "RustDesk Remote Desktop"|description = "${{ inputs.appname }}"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|ProductName = "RustDesk"|ProductName = "${{ inputs.appname }}"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ inputs.appname }}"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ inputs.appname }}.exe"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|"RustDesk Remote Desktop"|"${{ inputs.appname }}"|'' ./flutter/windows/runner/Runner.rc

        sed -i -e ''s|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ inputs.appname }}" "\0"|'' ./flutter/windows/runner/Runner.rc

        sed -i -e ''s|"Copyright © 2025 Purslane Ltd. All rights reserved."|"Copyright © 2025"|'' ./flutter/windows/runner/Runner.rc

        sed -i -e ''s|"rustdesk.exe"|"${{ inputs.filename }}"|'' ./flutter/windows/runner/Runner.rc

        sed -i -e ''s|"RustDesk"|"${{ inputs.appname }}"|'' ./flutter/windows/runner/Runner.rc

        find ./src/lang -name "*.rs" -exec sed -i -e ''s|RustDesk|${{ inputs.appname }}|'' {} \;

        sed -i -e ''s|RustDesk|${{ inputs.appname }}|'' ./flutter/android/app/src/main/res/values/strings.xml

        sed -i -e "s|title: ''RustDesk''|title: ''${{ inputs.appname }}''|" ./flutter/lib/main.dart

        sed -i -e "s|return ''RustDesk'';|return ''${{ inputs.appname }}'';|" ./flutter/lib/web/bridge.dart

        sed -i ''s|android:label="RustDesk"|android:label="${{ inputs.appname }}"|'' ./flutter/android/app/src/main/AndroidManifest.xml

        sed -i ''s|android:label="RustDesk Input"|android:label="${{ inputs.appname }} Input"|'' ./flutter/android/app/src/main/AndroidManifest.xml

        sed -i ''s|RustDesk is Open|${{ inputs.appname }} is Open|'' ./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/BootReceiver.kt

        sed -i ''s|Show Rustdesk|Show ${{ inputs.appname }}|'' ./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/FloatingWindowService.kt

        sed -i ''s|"RustDesk"|"${{ inputs.appname }}"|'' ./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt

        sed -i ''s|"RustDesk Service|"${{ inputs.appname }} Service|'' ./flutter/android/app/src/main/kotlin/com/carriez/flutter_hbb/MainService.kt

        sed -i ''s|RustDesk|${{ inputs.appname }}|'' ./flutter/lib/main.dart

        sed -i ''s|"RustDesk"|"${{ inputs.appname }}"|'' ./flutter/lib/desktop/widgets/tabbar_widget.dart

        sed -i ''s|"RustDesk"|"${{ inputs.appname }}"|'' ./libs/hbb_common/src/config.rs

        '
    - name: change url to custom
      if: fromJson(inputs.extras).urlLink != 'https://rustdesk.com'
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|Homepage: https://rustdesk.com|Homepage: ${{ fromJson(inputs.extras).urlLink }}|'' ./build.py

        sed -i -e "s|launchUrl(Uri.parse(''https://rustdesk.com''));|launchUrl(Uri.parse(''${{ fromJson(inputs.extras).urlLink }}''));|" ./flutter/lib/common.dart

        sed -i -e "s|launchUrlString(''https://rustdesk.com'');|launchUrlString(''${{ fromJson(inputs.extras).urlLink }}'');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart

        sed -i -e "s|launchUrlString(''https://rustdesk.com/privacy.html'')|launchUrlString(''${{ fromJson(inputs.extras).urlLink }}/privacy.html'')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart

        sed -i -e "s|const url = ''https://rustdesk.com/'';|const url = ''${{ fromJson(inputs.extras).urlLink }}'';|" ./flutter/lib/mobile/pages/settings_page.dart

        sed -i -e "s|launchUrlString(''https://rustdesk.com/privacy.html'')|launchUrlString(''${{ fromJson(inputs.extras).urlLink }}/privacy.html'')|" ./flutter/lib/mobile/pages/settings_page.dart

        sed -i -e "s|https://rustdesk.com/privacy.html|${{ fromJson(inputs.extras).urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart

        '
    - name: change download link to custom
      if: fromJson(inputs.extras).downloadLink != 'https://rustdesk.com/download'
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|'' ./flutter/lib/desktop/pages/desktop_home_page.dart

        sed -i -e ''s|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|'' ./flutter/lib/mobile/pages/connection_page.dart

        sed -i -e ''s|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|'' ./src/ui/index.tis

        '
    - name: allow custom.txt
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''/const KEY:/,/};/d'' ./src/common.rs

        sed -i -e ''/let Ok(data) = sign::verify(&data, &pk)/,/};/d'' ./src/common.rs

        # sed -i ''/intl:/a \ \ archive: ^3.6.1'' ./flutter/pubspec.yaml

        '
    - name: fix connection delay
      continue-on-error: true
      if: ${{ fromJson(inputs.extras).delayFix == 'true' }}
      shell: bash
      run: 'sed -i -e ''/if !key.is_empty() && !token.is_empty() {/,/}/d'' ./src/client.rs

        '
    - name: add cycle monitors to toolbar
      continue-on-error: true
      if: fromJson(inputs.extras).cycleMonitor == 'true'
      run: 'wget ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/cycle_monitor.diff

        git apply cycle_monitor.diff

        '
    - name: use X for offline display instead of orange circle
      continue-on-error: true
      if: fromJson(inputs.extras).xOffline == 'true'
      run: 'wget ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/xoffline.diff

        git apply xoffline.diff

        '
    - name: hide-cm
      continue-on-error: true
      if: fromJson(inputs.extras).hidecm == 'true'
      run: 'wget ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/hidecm.diff

        git apply hidecm.diff

        '
    - name: removeNewVersionNotif
      continue-on-error: true
      if: fromJson(inputs.extras).removeNewVersionNotif == 'true'
      run: 'sed -i -e ''s|updateUrl.isNotEmpty|false|'' ./flutter/lib/desktop/pages/desktop_home_page.dart

        '
    - name: Building · 35%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '35'
        label: Building
      continue-on-error: true
    - name: replace flutter icons
      if: ${{ inputs.iconlink != 'false' }}
      run: 'pushd ./flutter

        flutter pub get

        dart run flutter_launcher_icons

        popd

        sed -i ''/ic_launcher_background/d'' ./flutter/android/app/src/main/res/values/colors.xml

        '
    - name: Build rustdesk lib
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: "rustup target add ${{ matrix.job.target }}\ncargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked\ncase ${{ matrix.job.target }} in\n  aarch64-linux-android)\n  ./flutter/ndk_arm64.sh\n  mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a\n  cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n  ;;\n  armv7-linux-androideabi)\n    ./flutter/ndk_arm.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\n  ;;\n  x86_64-linux-android)\n    ./flutter/ndk_x64.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\n  ;;\n  i686-linux-android)\n    ./flutter/ndk_x86.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n  ;;\nesac\n"
    - name: Upload Rustdesk library to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: librustdesk.so.${{ matrix.job.target }}
        path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so
    - name: Building · 45%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '45'
        label: Building
      continue-on-error: true
    - name: icons
      if: ${{ inputs.iconlink != 'false' }}
      continue-on-error: true
      run: 'mv ./flutter/assets/icon.svg ./flutter/assets/icon.svg.bak

        convert ./res/icon.png ./flutter/assets/icon.svg

        convert ./res/128x128.png -resize 200% ./flutter/assets/128x128@2x.png || true

        cp ./flutter/assets/icon.svg ./res/scalable.svg

        '
    - name: Build rustdesk
      shell: bash
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: "export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH\n# temporary use debug sign config\nsed -i \"s/signingConfigs.release/signingConfigs.debug/g\" ./flutter/android/app/build.gradle\ncase ${{ matrix.job.target }} in\n  aarch64-linux-android)\n  mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a\n  cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/\n  cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n  echo -n \"${{ inputs.custom }}\" | cat > ./flutter/assets/custom.txt\n  #sed -i '/^    - assets\\//a\\    - assets/custom.txt' ./flutter/pubspec.yaml\n  # build flutter\n  pushd flutter\n  flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-arm64 --split-per-abi\n  mv build/app/outputs/flutter-apk/app-arm64-v8a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\n  armv7-linux-androideabi)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\n    echo -n \"${{ inputs.custom }}\" | cat > ./flutter/assets/custom.txt\n    #sed -i '/^    - assets\\//a\\    - assets/custom.txt' ./flutter/pubspec.yaml\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-arm --split-per-abi\n    mv build/app/outputs/flutter-apk/app-armeabi-v7a-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\n  x86_64-linux-android)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86_64/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\n    echo -n \"${{ inputs.custom }}\" | cat > ./flutter/assets/custom.txt\n    #sed -i '/^    - assets\\//a\\    - assets/custom.txt' ./flutter/pubspec.yaml\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-x64 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-x86_64-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\n  i686-linux-android)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/x86/\n    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n    echo -n \"${{ inputs.custom }}\" | cat > ./flutter/assets/custom.txt\n    #sed -i '/^    - assets\\//a\\    - assets/custom.txt' ./flutter/pubspec.yaml\n    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype }}\" --target-platform android-x86 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-x86-${{ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk\n  ;;\nesac\npopd\nmkdir -p signed-apk; pushd signed-apk\nmv ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix }}.apk ./${{ inputs.filename }}-${{ matrix.job.arch }}.apk\npopd\n"
    - name: Building · 75%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '75'
        label: Building
      continue-on-error: true
    - uses: r0adkll/sign-android-release@v1
      name: Sign app APK
      continue-on-error: true
      if: env.ANDROID_SIGNING_KEY != null
      id: sign-rustdesk
      with:
        releaseDirectory: ./signed-apk
        signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
        alias: ${{ secrets.ANDROID_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: 30.0.2
    - name: Collect artifacts
      id: collect
      shell: bash
      run: "set -u\nmkdir -p dist\nfound=0\nfor pat in *.apk; do\n  for f in $pat; do\n    [ -f \"$f\" ] || continue\n    cp \"$f\" dist/ && found=$((found+1))\n  done\ndone\nif [ \"$found\" -eq 0 ]; then echo \"::error::no artifact matched\"; exit 1; fi\nls -1 dist\n{ echo 'files<<RDGEN_EOF'; (cd dist && ls -1 | sed 's|^|dist/|'); echo 'RDGEN_EOF'; } >> \"$GITHUB_OUTPUT\"\n"
    - name: Deliver artifact
      uses: ./.rdgen/.github/actions/deliver
      with:
        uuid: ${{ inputs.uuid }}
        out-name: ${{ inputs.filename }}
        files: ${{ steps.collect.outputs.files }}
    needs:
    - bridge
  finish:
    name: Finish
    runs-on: ubuntu-latest
    needs:
    - build
    - bridge
    steps:
    - name: Load rdgen action definitions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        path: .rdgen
        sparse-checkout: .github/actions .github/patches
        sparse-checkout-cone-mode: false
    - name: Report success
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: ''
        label: ''
        status: Success
      continue-on-error: true
    if: success()
  failed:
    name: Report failure
    runs-on: ubuntu-latest
    needs:
    - build
    - bridge
    if: failure() || cancelled()
    steps:
    - name: Load rdgen action definitions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        path: .rdgen
        sparse-checkout: .github/actions .github/patches
        sparse-checkout-cone-mode: false
    - name: Report terminal state
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: ''
        label: ''
        status: ${{ cancelled() && 'Generation cancelled, please retry' || 'Generation failed, please retry' }}
      continue-on-error: true
