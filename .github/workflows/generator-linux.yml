name: Custom Linux Client Generator
run-name: Custom Linux Client Generator · ${{ inputs.appname }} (${{ fromJson(inputs.extras).version }})
true:
  workflow_dispatch:
    inputs:
      server:
        description: Rendezvous Server
        required: true
        default: ''
        type: string
      key:
        description: Public Key
        required: true
        default: ''
        type: string
      apiServer:
        description: API Server
        required: true
        default: ''
        type: string
      custom:
        description: Custom JSON (base64)
        required: true
        default: ''
        type: string
      uuid:
        description: uuid of request
        required: true
        default: ''
        type: string
      iconlink:
        description: icon link
        required: false
        default: 'false'
        type: string
      logolink:
        description: logo link
        required: false
        default: 'false'
        type: string
      appname:
        description: app name
        required: true
        default: rustdesk
        type: string
      filename:
        description: Filename
        required: true
        default: rustdesk
        type: string
      extras:
        description: extra inputs in json
        required: true
        default: '{}'
        type: string
permissions:
  contents: read
concurrency:
  group: rdgen-${{ inputs.uuid }}
  cancel-in-progress: false
env:
  GENURL: ${{ secrets.GENURL }}
  CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
  FB_URL: ${{ secrets.FB_URL }}
  FB_USER: ${{ secrets.FB_USER }}
  FB_PASS: ${{ secrets.FB_PASS }}
  FB_DIR: ${{ vars.FB_DIR }}
  API_SERVER: ${{ inputs.apiServer }}
jobs:
  bridge:
    name: Prepare shared bridge artifacts
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ fromJson(inputs.extras).version }}
  build:
    name: Custom Linux Client Generator
    runs-on: ${{ matrix.job.on }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: x86_64
          target: x86_64-unknown-linux-gnu
          distro: ubuntu18.04
          true: ubuntu-20.04
          deb_arch: amd64
          vcpkg-triplet: x64-linux
        - arch: aarch64
          target: aarch64-unknown-linux-gnu
          distro: ubuntu18.04
          true: ubuntu-22.04-arm
          deb_arch: arm64
          vcpkg-triplet: arm64-linux
    steps:
    - name: Load rdgen action definitions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        path: .rdgen
        sparse-checkout: .github/actions .github/patches
        sparse-checkout-cone-mode: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v6
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Set rdgen value
      if: ${{ fromJson(inputs.extras).rdgen == 'true' }}
      run: 'echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $GITHUB_ENV

        '
    - name: Set rdgen value
      if: ${{ fromJson(inputs.extras).rdgen == 'false' }}
      run: 'echo "STATUS_URL=${{ inputs.apiServer }}/api/updategh" >> $GITHUB_ENV

        '
    - name: Building · 5%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '5'
        label: Building
      continue-on-error: true
    - name: Maximize build space
      run: "sudo rm -rf /opt/ghc\nsudo rm -rf /usr/local/lib/android\nsudo rm -rf /usr/share/dotnet\nsudo apt-get update -y\nsudo apt-get install -y nasm\nif [[ \"${{ matrix.job.arch }}\" == \"x86_64\" ]]; then\n  sudo apt-get install -y qemu-user-static\nfi\n"
    - name: Install dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y imagemagick

        '
    - name: Checkout source code
      if: ${{ env.VERSION != 'master' }}
      uses: actions/checkout@v4
      with:
        repository: rustdesk/rustdesk
        ref: refs/tags/${{ env.VERSION }}
        submodules: recursive
    - name: Checkout source code
      if: ${{ env.VERSION == 'master' }}
      uses: actions/checkout@v4
      with:
        repository: rustdesk/rustdesk
        submodules: recursive
    - name: Set Swap Space
      if: ${{ matrix.job.arch == 'x86_64' }}
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12
    - name: Free Space
      run: 'df -h

        free -m

        '
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - name: Save Rust toolchain version
      run: 'RUST_TOOLCHAIN_VERSION=$(cargo --version | awk ''{print $2}'')

        echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

        '
    - name: Disable rust bridge build
      run: '# only build cdylib

        sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

        '
    - name: Building · 15%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '15'
        label: Building
      continue-on-error: true
    - name: Restore bridge files
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      uses: actions/download-artifact@v4
      with:
        name: bridge-artifact
        path: ./
    - name: Setup vcpkg with Github Actions binary cache
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      run: "sudo apt install -y libva-dev libvdpau-dev\nif ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log\" || true\n"
      shell: bash
    - name: icon stuff
      if: ${{ inputs.iconlink != 'false' }}
      continue-on-error: true
      shell: bash
      run: 'mv ./res/icon.ico ./res/icon.ico.bak

        mv ./res/icon.png ./res/icon.png.bak

        mv ./res/tray-icon.ico ./res/tray-icon.ico.bak

        wget -O ./res/icon.png ${{ fromJson(inputs.iconlink).url }}/get_png?filename=${{ fromJson(inputs.iconlink).file }}"&"uuid=${{ fromJson(inputs.iconlink).uuid }}

        mv ./res/32x32.png ./res/32x32.png.bak

        mv ./res/64x64.png ./res/64x64.png.bak

        mv ./res/128x128.png ./res/128x128.png.bak

        mv ./res/128x128@2x.png ./res/128x128@2x.png.bak

        convert ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico

        convert ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/tray-icon.ico

        cp ./res/icon.ico ./res/tray-icon.ico

        convert ./res/icon.png -resize 32x32 ./res/32x32.png

        convert ./res/icon.png -resize 64x64 ./res/64x64.png

        convert ./res/icon.png -resize 128x128 ./res/128x128.png

        convert ./res/128x128.png -resize 200% ./res/128x128@2x.png

        cp ./src/ui.rs ./src/ui.rs.bak

        b64=$(base64 < ./res/icon.png)

        sed -i -e ''s||$(echo
        "$b64")|'' ./src/ui.rs

        b64=""

        '
    - name: change appname to custom
      if: inputs.appname != 'rustdesk'
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|description = "RustDesk Remote Desktop"|description = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|ProductName = "RustDesk"|ProductName = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ inputs.appname }}.exe"|'' ./Cargo.toml

        sed -i -e ''s|description = "RustDesk Remote Desktop"|description = "${{ inputs.appname }}"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|ProductName = "RustDesk"|ProductName = "${{ inputs.appname }}"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ inputs.appname }}"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ inputs.appname }}.exe"|'' ./libs/portable/Cargo.toml

        find ./src/lang -name "*.rs" -exec sed -i -e ''s|RustDesk|${{ inputs.appname }}|'' {} \;

        sed -i -e ''/-p tmpdeb\/usr\/lib\/rustdesk/d'' ./build.py

        '
    - name: change company name
      if: fromJson(inputs.extras).compname != 'Purslane Ltd'
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|'' ./flutter/lib/desktop/pages/desktop_setting_page.dart

        sed -i -e ''s|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|'' ./Cargo.toml

        sed -i -e ''s|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|'' ./libs/portable/Cargo.toml

        '
    - name: allow custom.txt
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|rs-ny.rustdesk.com|${{ inputs.server }}|'' ./libs/hbb_common/src/config.rs

        sed -i -e ''s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ inputs.key }}|'' ./libs/hbb_common/src/config.rs

        wget ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/allowCustom.diff

        git apply allowCustom.diff

        wget ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/removeSetupServerTip.diff

        git apply removeSetupServerTip.diff

        echo -n "${{ inputs.custom }}" | cat > ./custom.txt

        # sed -i ''/intl:/a \ \ archive: ^3.6.1'' ./flutter/pubspec.yaml

        sed -i -e ''s|https://admin.rustdesk.com|${{ inputs.apiServer }}|'' ./src/common.rs

        '
    - name: change url to custom
      if: fromJson(inputs.extras).urlLink != 'https://rustdesk.com'
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|Homepage: https://rustdesk.com|Homepage: ${{ fromJson(inputs.extras).urlLink }}|'' ./build.py

        sed -i -e "s|launchUrl(Uri.parse(''https://rustdesk.com''));|launchUrl(Uri.parse(''${{ fromJson(inputs.extras).urlLink }}''));|" ./flutter/lib/common.dart

        sed -i -e "s|launchUrlString(''https://rustdesk.com'');|launchUrlString(''${{ fromJson(inputs.extras).urlLink }}'');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart

        sed -i -e "s|launchUrlString(''https://rustdesk.com/privacy.html'')|launchUrlString(''${{ fromJson(inputs.extras).urlLink }}/privacy.html'')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart

        sed -i -e "s|const url = ''https://rustdesk.com/'';|const url = ''${{ fromJson(inputs.extras).urlLink }}'';|" ./flutter/lib/mobile/pages/settings_page.dart

        sed -i -e "s|launchUrlString(''https://rustdesk.com/privacy.html'')|launchUrlString(''${{ fromJson(inputs.extras).urlLink }}/privacy.html'')|" ./flutter/lib/mobile/pages/settings_page.dart

        sed -i -e "s|https://rustdesk.com/privacy.html|${{ fromJson(inputs.extras).urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart

        '
    - name: change download link to custom
      if: fromJson(inputs.extras).downloadLink != 'https://rustdesk.com/download'
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|'' ./flutter/lib/desktop/pages/desktop_home_page.dart

        sed -i -e ''s|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|'' ./flutter/lib/mobile/pages/connection_page.dart

        sed -i -e ''s|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|'' ./src/ui/index.tis

        '
    - name: fix connection delay
      continue-on-error: true
      if: ${{ fromJson(inputs.extras).delayFix == 'true' }}
      shell: bash
      run: 'sed -i -e ''/if !key.is_empty() && !token.is_empty() {/,/}/d'' ./src/client.rs

        '
    - name: add cycle monitors to toolbar
      continue-on-error: true
      if: fromJson(inputs.extras).cycleMonitor == 'true'
      run: 'wget ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/cycle_monitor.diff

        git apply cycle_monitor.diff

        '
    - name: use X for offline display instead of orange circle
      continue-on-error: true
      if: fromJson(inputs.extras).xOffline == 'true'
      run: 'wget ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/xoffline.diff

        git apply xoffline.diff

        '
    - name: hide-cm
      continue-on-error: true
      if: fromJson(inputs.extras).hidecm == 'true'
      run: 'wget ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/hidecm.diff

        git apply hidecm.diff

        '
    - name: removeNewVersionNotif
      continue-on-error: true
      if: fromJson(inputs.extras).removeNewVersionNotif == 'true'
      run: 'sed -i -e ''s|updateUrl.isNotEmpty|false|'' ./flutter/lib/desktop/pages/desktop_home_page.dart

        '
    - name: Restore bridge files
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      uses: actions/download-artifact@v4
      with:
        name: bridge-artifact
        path: ./
    - name: Building · 65%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '65'
        label: Building
      continue-on-error: true
    - uses: rustdesk-org/run-on-arch-action@amd64-support
      name: Build rustdesk
      id: vcpkg
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      with:
        arch: ${{ matrix.job.arch }}
        distro: ${{ matrix.job.distro }}
        githubToken: ${{ github.token }}
        setup: 'ls -l "${PWD}"

          ls -l /opt/artifacts/vcpkg/installed

          '
        dockerRunArgs: '--volume "${PWD}:/workspace"

          --volume "/opt/artifacts:/opt/artifacts"

          '
        shell: /bin/bash
        install: "apt-get update -y\necho -e \"installing deps\"\napt-get install -y \\\n   build-essential \\\n   clang \\\n   cmake \\\n   curl \\\n   gcc \\\n   git \\\n   g++ \\\n   imagemagick \\\n   libayatana-appindicator3-dev \\\n   libasound2-dev \\\n   libclang-dev \\\n   libgstreamer1.0-dev \\\n   libgstreamer-plugins-base1.0-dev \\\n   libgtk-3-dev \\\n   libpam0g-dev \\\n   libpulse-dev \\\n   libva-dev \\\n   libvdpau-dev \\\n   libxcb-randr0-dev \\\n   libxcb-shape0-dev \\\n   libxcb-xfixes0-dev \\\n   libxdo-dev \\\n   libxfixes-dev \\\n   llvm-dev \\\n   nasm \\\n   ninja-build \\\n   pkg-config \\\n   tree \\\n   python3 \\\n   rpm \\\n   unzip \\\n   wget \\\n   xz-utils\n# we have libopus compiled by us.\napt-get remove -y libopus-dev || true\n# output devs\nls -l ./\ntree -L 3 /opt/artifacts/vcpkg/installed\n"
        run: "# disable git safe.directory\ngit config --global --add safe.directory \"*\"\n# rust\npushd /opt\n# do not use rustup, because memory overflow in qemu\nwget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}.tar.gz\ntar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz\ncd rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }} && ./install.sh\nrm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}\n# edit config\nmkdir -p ~/.cargo/\necho \"\"\"\n  [source.crates-io]\n  registry = 'https://github.com/rust-lang/crates.io-index'\n\"\"\" > ~/.cargo/config\ncat ~/.cargo/config\n# start build\npushd /workspace\nexport VCPKG_ROOT=/opt/artifacts/vcpkg\nif [[ \"${{ matrix.job.arch }}\" == \"aarch64\" ]]; then\n  export JOBS=\"--jobs 3\"\nelse\n  export JOBS=\"\"\nfi\necho $JOBS\ncargo build --lib $JOBS --features hwcodec,flutter,unix-file-copy-paste --release\nrm -rf target/release/deps target/release/build\nrm -rf ~/.cargo\n\n# Setup Flutter\n# disable git safe.directory\ngit config --global --add safe.directory \"*\"\npushd /workspace\ncase ${{ matrix.job.arch }} in\n  aarch64)\n    export PATH=/opt/flutter-elinux/bin:$PATH\n    sed -i \"s/flutter build linux --release/flutter-elinux build linux --verbose/g\" ./build.py\n    sed -i \"s/x64\\/release/arm64\\/release/g\" ./build.py\n  ;;\n  x86_64)\n    export PATH=/opt/flutter/bin:$PATH\n  ;;\nesac\npopd\npushd /opt\nwget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz\ntar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz\ncase ${{ matrix.job.arch }} in\n  aarch64)\n    # clone repo and reset to flutter ${{ env.FLUTTER_VERSION }}\n    git clone https://github.com/sony/flutter-elinux.git || true\n    pushd flutter-elinux\n      git fetch\n      git reset --hard ${{ env.FLUTTER_VERSION }}\n      bin/flutter-elinux doctor -v\n      bin/flutter-elinux precache --linux\n    popd\n    cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64\n    rm -rf flutter\n  ;;\n  x86_64)\n    flutter doctor -v\n  ;;\nesac\n\nif [[ \"3.24.5\" == ${{ env.FLUTTER_VERSION }} ]]; then\n  case ${{ matrix.job.arch }} in\n    aarch64)\n      pushd /opt/flutter-elinux/flutter\n    ;;\n    x86_64)\n      pushd /opt/flutter\n    ;;\n  esac\n  git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff\n  popd\nfi\n\n# build flutter\npushd /workspace\nmkdir output\nchmod 777 output -R\nexport CARGO_INCREMENTAL=0\nexport DEB_ARCH=${{ matrix.job.deb_arch }}\nmkdir -p flutter/tmpdeb/usr/share/rustdesk\ncp ./custom.txt ./flutter/tmpdeb/usr/share/rustdesk/custom.txt\nif [[ \"${{ inputs.logolink }}\" != \"false\" ]]; then\n  wget -O ./flutter/assets/logo.png ${{ fromJson(inputs.logolink).url }}/get_png?filename=${{ fromJson(inputs.logolink).file }}\"&\"uuid=${{ fromJson(inputs.logolink).uuid }}\nfi\nif [[ \"${{ inputs.iconlink }}\" != \"false\" ]]; then\n  mv ./flutter/assets/icon.svg ./flutter/assets/icon.svg.bak\n  convert ./res/icon.png ./flutter/assets/icon.svg\n  convert ./res/128x128.png -resize 200% ./flutter/assets/128x128@2x.png || true\n  cp ./flutter/assets/icon.svg ./res/scalable.svg\n  pushd ./flutter\n  if [[ \"${{ matrix.job.arch }}\" == \"aarch64\" ]]; then\n    export PATH=\"/opt/flutter-elinux/flutter/bin:$PATH\"\n  fi\n  flutter pub get\n  dart run flutter_launcher_icons\n  popd\nfi\npython3 ./build.py --flutter --skip-cargo\nfor name in rustdesk*??.deb; do\n  mv \"$name\" /workspace/output/\"${{ inputs.filename }}-${{ matrix.job.arch }}.deb\"\ndone\n\n# rpm package\necho -e \"start packaging fedora package\"\npushd /workspace\ncase ${{ matrix.job.arch }} in\n  aarch64)\n    sed -i \"s/linux\\/x64/linux\\/arm64/g\" ./res/rpm-flutter.spec\n    ;;\nesac\nHBB=`pwd` rpmbuild ./res/rpm-flutter.spec -bb\npushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}\nfor name in rustdesk*??.rpm; do\n    mv \"$name\" /workspace/output/\"\
          ${{ inputs.filename }}-${{ matrix.job.arch }}.rpm\"\ndone\n\n# rpm suse package\necho -e \"start packaging suse package\"\npushd /workspace\ncase ${{ matrix.job.arch }} in\n  aarch64)\n    sed -i \"s/linux\\/x64/linux\\/arm64/g\" ./res/rpm-flutter-suse.spec\n    ;;\nesac\nHBB=`pwd` rpmbuild ./res/rpm-flutter-suse.spec -bb\npushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}\nfor name in rustdesk*??.rpm; do\n    mv \"$name\" /workspace/output/\"${{ inputs.filename }}-suse-${{ matrix.job.arch }}.rpm\"\ndone\n"
    - name: Patch archlinux PKGBUILD
      continue-on-error: true
      if: matrix.job.arch == 'x86_64' && env.UPLOAD_ARTIFACT == 'true' && env.VERSION != 'master'
      run: "sed -i \"s/x86_64/${{ matrix.job.arch }}/g\" res/PKGBUILD\nif [[ \"${{ matrix.job.arch }}\" == \"aarch64\" ]]; then\n  sed -i \"s/x86_64/aarch64/g\" ./res/PKGBUILD\nfi\n"
    - name: Build archlinux package
      continue-on-error: true
      if: matrix.job.arch == 'x86_64' && env.UPLOAD_ARTIFACT == 'true' && env.VERSION != 'master'
      uses: rustdesk-org/arch-makepkg-action@master
      with:
        packages: null
        scripts: 'cd res && HBB=`pwd`/.. FLUTTER=1 makepkg -f

          '
    - name: Rename archlinux package
      continue-on-error: true
      if: matrix.job.arch == 'x86_64' && env.UPLOAD_ARTIFACT == 'true' && env.VERSION != 'master'
      run: 'cp ./res/rustdesk-${{ env.VERSION }}-0-x86_64.pkg.tar.zst ./output/${{ inputs.filename }}-${{ matrix.job.arch }}.pkg.tar.zst

        '
    - name: Collect artifacts
      id: collect
      shell: bash
      run: "set -u\nmkdir -p dist\nfound=0\nfor pat in *.deb *.rpm *.zst; do\n  for f in $pat; do\n    [ -f \"$f\" ] || continue\n    cp \"$f\" dist/ && found=$((found+1))\n  done\ndone\nif [ \"$found\" -eq 0 ]; then echo \"::error::no artifact matched\"; exit 1; fi\nls -1 dist\n{ echo 'files<<RDGEN_EOF'; (cd dist && ls -1 | sed 's|^|dist/|'); echo 'RDGEN_EOF'; } >> \"$GITHUB_OUTPUT\"\n"
    - name: Deliver artifact
      uses: ./.rdgen/.github/actions/deliver
      with:
        uuid: ${{ inputs.uuid }}
        out-name: ${{ inputs.filename }}
        files: ${{ steps.collect.outputs.files }}
    needs:
    - bridge
  finish:
    name: Finish
    runs-on: ubuntu-latest
    needs:
    - build
    - bridge
    steps:
    - name: Load rdgen action definitions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        path: .rdgen
        sparse-checkout: .github/actions .github/patches
        sparse-checkout-cone-mode: false
    - name: Report success
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: ''
        label: ''
        status: Success
      continue-on-error: true
    if: success()
  failed:
    name: Report failure
    runs-on: ubuntu-latest
    needs:
    - build
    - bridge
    if: failure() || cancelled()
    steps:
    - name: Load rdgen action definitions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        path: .rdgen
        sparse-checkout: .github/actions .github/patches
        sparse-checkout-cone-mode: false
    - name: Report terminal state
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: ''
        label: ''
        status: ${{ cancelled() && 'Generation cancelled, please retry' || 'Generation failed, please retry' }}
      continue-on-error: true
