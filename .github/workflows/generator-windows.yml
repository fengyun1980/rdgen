  finish:
    name: Finish
    runs-on: ubuntu-latest
    needs:
    - build
    - bridge
    - helper
    steps:
    - name: Load rdgen action definitions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        path: .rdgen
        sparse-checkout: .github/actions .github/patches
        sparse-checkout-cone-mode: false
    - name: Report success
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: ''
        label: ''
        status: Success
      continue-on-error: true
    if: success()
  failed:
    name: Report failure
    runs-on: ubuntu-latest
    needs:
    - build
    - bridge
    - helper
    if: failure() || cancelled()
    steps:
    - name: Load rdgen action definitions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        path: .rdgen
        sparse-checkout: .github/actions .github/patches
        sparse-checkout-cone-mode: false
    - name: Report terminal state
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: ''
        label: ''
        status: ${{ cancelled() && 'Generation cancelled, please retry' || 'Generation failed, please retry' }}
      continue-on-error: true
