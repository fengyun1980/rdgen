name: Custom Windows Client Generator
run-name: Custom Windows Client Generator
on: 
  workflow_dispatch:
    inputs:
      server:
        description: 'Rendezvous Server'
        required: true
        default: ''
        type: string
      key:
        description: 'Public Key'
        required: true
        default: ''
        type: string
      apiServer:
        description: 'API Server'
        required: true
        default: ''
        type: string
      custom:
        description: "Custom JSON"
        required: true
        default: ''
        type: string
      uuid:
        description: "uuid of request"
        required: true
        default: ''
        type: string
      iconlink:
        description: "icon link"
        required: false
        default: 'false'
        type: string
      logolink:
        description: "logo link"
        required: false
        default: 'false'
        type: string
      appname:
        description: "app name"
        required: true
        default: 'rustdesk'
        type: string
      filename:
        description: "Filename"
        required: true
        default: 'rustdesk'
        type: string
      extras:
        description: "extra inputs in json"
        required: true
        default: '{}'
        type: string

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.14-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5" 
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2024.07.12
  VCPKG_COMMIT_ID: "460551b0ec06be1ba6b918448bf3b0f44add813d"
  VERSION: "${{ fromJson(inputs.extras).version }}"
  NDK_VERSION: "r27c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ fromJson(inputs.extras).version }}

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static,
            }
          # - { target: aarch64-pc-windows-msvc, os: windows-2022, arch: aarch64 }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      
      - name: Set rdgen value
        if: ${{ fromJson(inputs.extras).rdgen == 'true' }}
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ fromJson(inputs.extras).rdgen == 'false' }}
        run: |
          echo "STATUS_URL=${{ inputs.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Report Status (5% complete)
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="5% complete"
          # inline JSON (no python): only " and \ need escaping here
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"

      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml
      
      - name: change appname to custom
        if: inputs.appname != 'rustdesk'
        continue-on-error: true
        shell: bash
        run: |
          # ./Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ inputs.appname }}"|' ./Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ inputs.appname }}"|' ./Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ inputs.appname }}"|' ./Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ inputs.appname }}.exe"|' ./Cargo.toml
          # ./libs/portable/Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ inputs.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ inputs.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ inputs.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ inputs.appname }}.exe"|' ./libs/portable/Cargo.toml
          # ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk Remote Desktop"|"${{ inputs.appname }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ inputs.appname }}" "\0"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"rustdesk.exe"|"${{ inputs.filename }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk"|"${{ inputs.appname }}"|' ./flutter/windows/runner/Runner.rc
          # ./src/lang/en.rs
          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ inputs.appname }}|' {} \;
          

      - name: change company name
        if: fromJson(inputs.extras).compname != 'Purslane Ltd'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|Purslane Ltd.|${{ fromJson(inputs.extras).compname }}|' ./res/setup.nsi
          sed -i -e 's|PURSLANE|${{ fromJson(inputs.extras).compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|"Copyright © 2025 Purslane Ltd. All rights reserved."|"Copyright © 2025 ${{ fromJson(inputs.extras).compname }}. All rights reserved."|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./libs/portable/Cargo.toml
             
      - name: change url to custom
        if: fromJson(inputs.extras).urlLink != 'https://rustdesk.com'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Homepage: https://rustdesk.com|Homepage: ${{ fromJson(inputs.extras).urlLink }}|' ./build.py
          sed -i -e "s|launchUrl(Uri.parse('https://rustdesk.com'));|launchUrl(Uri.parse('${{ fromJson(inputs.extras).urlLink }}'));|" ./flutter/lib/common.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com');|launchUrlString('${{ fromJson(inputs.extras).urlLink }}');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ fromJson(inputs.extras).urlLink }}/privacy.html')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|const url = 'https://rustdesk.com/';|const url = '${{ fromJson(inputs.extras).urlLink }}';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ fromJson(inputs.extras).urlLink }}/privacy.html')|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|https://rustdesk.com/privacy.html|${{ fromJson(inputs.extras).urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart
          sed -i -e "s|https://rustdesk.com/|${{fromJson(inputs.extras).urlLink }}|" ./res/setup.nsi

      - name: change download link to custom
        if: fromJson(inputs.extras).downloadLink != 'https://rustdesk.com/download'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|' ./flutter/lib/mobile/pages/connection_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|' ./src/ui/index.tis

      - name: set server, key, and apiserver
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|rs-ny.rustdesk.com|${{ inputs.server }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ inputs.key }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|https://admin.rustdesk.com|${{ inputs.apiServer }}|' ./src/common.rs
          # ./flutter/pubspec.yaml
          #sed -i '/intl:/a \ \ archive: ^3.6.1' ./flutter/pubspec.yaml

      - name: allow custom.txt
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allowCustom.diff -OutFile allowCustom.diff
          git apply allowCustom.diff
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/removeSetupServerTip.diff -OutFile removeSetupServerTip.diff
          git apply removeSetupServerTip.diff

      # GitHub Releases returned 504 six times in a row for this file. The stock
      # installer (directory= is its INSTALL TARGET, not a local package dir;
      # url= overrides the download source) retries only twice and then aborts.
      #
      # Implemented INLINE on purpose: an earlier version called a composite
      # action under .github/actions/, which failed with "Can't find
      # 'action.yml'" whenever that directory had not been committed. Keeping the
      # logic in the workflow removes that dependency entirely.
      - name: Pre-seed LLVM installer (GitHub Releases returns intermittent 504)
        id: llvm_seed
        shell: pwsh
        continue-on-error: true
        env:
          LLVM_VER: ${{ env.LLVM_VERSION }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "C:\llvm-installer\LLVM-$env:LLVM_VER-win64.exe"
          $url  = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VER/LLVM-$env:LLVM_VER-win64.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          "downloaded=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          if ((Test-Path $dest) -and ((Get-Item $dest).Length -gt 100MB)) {
            Write-Host "already present: $dest"
            "downloaded=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $attempt = 0
          $delay = 5
          while ($attempt -lt 10) {
            $attempt++
            Write-Host "attempt $attempt/10 -> $url"
            try {
              # -UseBasicParsing keeps this working on older PS without IE engine
              Invoke-WebRequest -Uri $url -OutFile "$dest.part" -UseBasicParsing -TimeoutSec 1800
              if ((Test-Path "$dest.part") -and ((Get-Item "$dest.part").Length -gt 100MB)) {
                Move-Item -Force "$dest.part" $dest
                Write-Host ("downloaded ok: {0:N1} MB" -f ((Get-Item $dest).Length/1MB))
                "downloaded=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
                exit 0
              }
              Write-Host "  too small, discarding"
              Remove-Item -Force "$dest.part" -ErrorAction SilentlyContinue
            } catch {
              Write-Host "  download failed: $($_.Exception.Message)"
              Remove-Item -Force "$dest.part" -ErrorAction SilentlyContinue
            }
            if ($attempt -lt 10) {
              Write-Host "  waiting ${delay}s"
              Start-Sleep -Seconds $delay
              $delay = [Math]::Min($delay * 2, 60)
            }
          }
          Write-Host "::warning::LLVM pre-seed failed after 10 attempts; the fallback action will retry"
          exit 0

      - name: Install LLVM from pre-seeded installer
        if: ${{ steps.llvm_seed.outputs.downloaded == 'true' }}
        shell: pwsh
        run: |
          $exe = "C:\llvm-installer\LLVM-${{ env.LLVM_VERSION }}-win64.exe"
          Write-Host "Installing from $exe"
          # Silent install (the upstream distribution is an NSIS installer).
          Start-Process -FilePath $exe -ArgumentList '/S','/D=C:\Program Files\LLVM' -Wait
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "C:\Program Files\LLVM\bin\clang.exe" --version

      - name: Install LLVM and Clang (fallback)
        if: ${{ steps.llvm_seed.outputs.downloaded != 'true' }}
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Report Status (10% complete)
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="10% complete"
          # inline JSON (no python): only " and \ need escaping here
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"

      - name: Install flutter
        uses: subosito/flutter-action@v2.12.0 #https://github.com/subosito/flutter-action/issues/277
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        continue-on-error: true
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Report Status (15% complete)
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="15% complete"
          # inline JSON (no python): only " and \ need escaping here
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}
        
      - name: Report Status (20% complete)
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="20% complete"
          # inline JSON (no python): only " and \ need escaping here
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"

      # run-vcpkg clones the repo then runs bootstrap-vcpkg.bat, which fetches
      # vcpkg.exe from GitHub Releases. That download hit 504 repeatedly (2 of 4
      # probes failed). Pre-seeding the exe lets bootstrap reuse it instead of
      # downloading. Inline (not a composite action) so it cannot fail with
      # "Can't find 'action.yml'" when only part of .github/ got committed.
      - name: Pre-seed vcpkg.exe (bootstrap download returns intermittent 504)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $dest = "C:\vcpkg\vcpkg.exe"
          $url  = "https://github.com/microsoft/vcpkg-tool/releases/download/2025-03-22/vcpkg.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          if ((Test-Path $dest) -and ((Get-Item $dest).Length -gt 1MB)) {
            Write-Host "already present: $dest"
            exit 0
          }
          $attempt = 0
          $delay = 5
          while ($attempt -lt 10) {
            $attempt++
            Write-Host "attempt $attempt/10 -> $url"
            try {
              Invoke-WebRequest -Uri $url -OutFile "$dest.part" -UseBasicParsing -TimeoutSec 300
              if ((Test-Path "$dest.part") -and ((Get-Item "$dest.part").Length -gt 1MB)) {
                Move-Item -Force "$dest.part" $dest
                Write-Host ("seeded vcpkg.exe: {0:N1} MB" -f ((Get-Item $dest).Length/1MB))
                exit 0
              }
              Remove-Item -Force "$dest.part" -ErrorAction SilentlyContinue
            } catch {
              Write-Host "  failed: $($_.Exception.Message)"
              Remove-Item -Force "$dest.part" -ErrorAction SilentlyContinue
            }
            if ($attempt -lt 10) { Start-Sleep -Seconds $delay; $delay = [Math]::Min($delay * 2, 60) }
          }
          Write-Host "::warning::vcpkg.exe pre-seed failed; bootstrap will download it itself"
          exit 0

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      # ---- NASM pre-seed (works around flaky nasm.us) ----------------------
      # aom's port calls vcpkg_find_acquire_program(NASM), which downloads
      # nasm-2.16.03-win64.zip from https://www.nasm.us -- its only upstream
      # source. vcpkg publishes no mirror for it, so when that host is slow the
      # Windows build dies at "Downloading nasm-2.16.03-win64.zip" with an
      # opaque exit code 1 and no further output.
      #
      # vcpkg_download_distfile skips the download when the archive is already in
      # <vcpkg root>/downloads with a matching SHA512, so seeding it there makes
      # aom independent of nasm.us. Cached by filename across runs.
      - name: Restore NASM archive from cache
        id: nasm-cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\downloads\nasm-2.16.03-win64.zip
          key: nasm-2.16.03-win64.zip-v1

      - name: Pre-seed NASM into vcpkg downloads
        if: steps.nasm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -u
          DEST="/c/vcpkg/downloads/nasm-2.16.03-win64.zip"
          mkdir -p /c/vcpkg/downloads
          if [ -s "$DEST" ]; then echo "already present: $DEST"; exit 0; fi
          echo "Fetching NASM from upstream..."
          # Non-fatal by design: vcpkg has its own retry logic and prints better
          # diagnostics than we can. Seeding is an optimisation, not a hard need.
          if curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \
               --connect-timeout 30 --max-time 300 \
               -o "$DEST.part" \
               "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip"; then
            # Verify the ZIP magic before publishing: some hosts answer with an
            # HTML error page carrying HTTP 200, which would poison the cache and
            # surface later as a confusing unzip failure.
            if [ "$(head -c2 "$DEST.part")" = "PK" ]; then
              mv "$DEST.part" "$DEST"
              echo "seeded $(stat -c%s "$DEST" 2>/dev/null || wc -c <"$DEST") bytes"
            else
              echo "::warning::downloaded file is not a ZIP (got HTML?); discarding"
              rm -f "$DEST.part"
            fi
          else
            echo "::warning::NASM pre-seed failed; vcpkg will try the origin itself"
            rm -f "$DEST.part"
          fi

      # ---------------------------------------------------------------- pkg-config
      # aom BUILT successfully (both dbg and rel) and then failed in
      # vcpkg_fixup_pkgconfig -> vcpkg_find_acquire_program(PKGCONFIG) ->
      # vcpkg_acquire_msys, which tries to download
      #   msys2-msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst
      # from six mirrors. That exact version has been rotated out of the
      # repositories (only 3.5.7-5/6 remain), so all six return 404 and the port
      # aborts. Nothing about the build itself is wrong.
      #
      # vcpkg_find_acquire_program(PKGCONFIG) short-circuits when PKG_CONFIG is
      # already set in the environment:
      #     if(DEFINED "ENV{PKG_CONFIG}") ... return()
      # so providing a working pkg-config.exe skips the msys2 download entirely.
      # The pkgconf package itself still downloads fine (86 KB, verified), only
      # the runtime bundle is gone.
      - name: Provide pkg-config (msys2-runtime 3.5.4-2 was rotated out of mirrors)
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $root = "C:\pkgconf"
          $pkg  = Join-Path $root "mingw-w64-x86_64-pkgconf-1~2.3.0-1-any.pkg.tar.zst"
          # SHA512 published by vcpkg itself in
          # scripts/cmake/vcpkg_find_acquire_program(PKGCONFIG).cmake at
          # VCPKG_COMMIT_ID -- an authoritative source, not a guess.
          $sha512 = "5373f050060678166968e09a4dd8ad30324c5dc37842c3517ebc9eb7be7e09d37d2873ff9dc4831c283556b68a0776f06fa6f91d799020b04282b4a3f378a2c4"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # CRITICAL: mirrors filter on User-Agent. Measured from a cloud IP:
          #   "vcpkg/<ver>" -> 200 | "curl/..." -> 403 | browser UA -> 403
          # The previous revision sent a browser UA, so EVERY mirror answered
          # 403, the archive was never extracted, the build logged
          # "pkg-config not runnable here" then died on the same msys2 404.
          # Impersonate vcpkg: that is the client these mirrors are tuned for.
          $name = "mingw-w64-x86_64-pkgconf-1~2.3.0-1-any.pkg.tar.zst"
          $mirrors = @(
            "https://mirror.msys2.org/mingw/mingw64/$name",
            "https://repo.msys2.org/mingw/mingw64/$name",
            "https://mirror.yandex.ru/mirrors/msys2/mingw/mingw64/$name",
            "https://mirror.selfnet.de/msys2/mingw/mingw64/$name"
          )
          $ua = "vcpkg/2025-03-22-d4dd14112c2026ee57e59f966ecfa3b9137bd143"

          function Test-Pkgconf {
            param($Path)
            if (-not (Test-Path $Path)) { return $false }
            if ((Get-Item $Path).Length -lt 50000) { return $false }
            $actual = (Get-FileHash -Path $Path -Algorithm SHA512).Hash.ToLower()
            return ($actual -eq $sha512)
          }

          if (Test-Pkgconf $pkg) {
            Write-Host "pkgconf archive already present and verified"
          } else {
            Remove-Item $pkg -Force -ErrorAction SilentlyContinue
            $ok = $false
            foreach ($url in $mirrors) {
              if ($ok) { break }
              $h = ([uri]$url).Host
              foreach ($attempt in 1..2) {
                try {
                  Invoke-WebRequest -Uri $url -OutFile "$pkg.part" -UseBasicParsing `
                    -TimeoutSec 180 -UserAgent $ua -Headers @{ "Accept" = "*/*" }
                  Move-Item "$pkg.part" $pkg -Force
                  if (Test-Pkgconf $pkg) {
                    Write-Host "pkgconf fetched from $h (SHA512 verified)"
                    $ok = $true
                    break
                  }
                  Write-Host "::warning::$h served an archive with the wrong checksum; discarding"
                  Remove-Item $pkg -Force -ErrorAction SilentlyContinue
                } catch {
                  $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { "ERR" }
                  Write-Host "::warning::$h attempt $attempt failed (HTTP $code)"
                  Remove-Item "$pkg.part" -Force -ErrorAction SilentlyContinue
                  if ($code -eq 404) { break }   # dead path: no point retrying this host
                  Start-Sleep -Seconds 3
                }
              }
            }
            if (-not $ok) {
              Write-Host "::error::no mirror served a valid pkgconf archive; vcpkg will fall back to msys2 (which 404s on msys2-runtime 3.5.4-2)"
              exit 0
            }
          }

          # Windows 11 / Server 2022 ship bsdtar as tar.exe, which reads zstd.
          Push-Location $root
          tar -xf $pkg 2>&1 | Out-Null
          $exe = Join-Path $root "mingw64\bin\pkg-config.exe"
          Pop-Location

          if (Test-Path $exe) {
            Write-Host "pkg-config ready: $exe"
            & $exe --version
            # NOTE: PowerShell 5.1's `Out-File -Encoding utf8` emits a BOM. In
            # GITHUB_ENV that BOM glues itself to the FIRST variable name, so
            # "PKG_CONFIG=x" silently becomes "\uFEFFPKG_CONFIG=x" and vcpkg
            # never sees it. Write UTF-8 *without* BOM instead.
            # The following step ALSO exports PKG_CONFIG inside its own shell,
            # which is the path that actually matters (see there).
            [System.IO.File]::AppendAllText(
              $env:GITHUB_ENV, "PKG_CONFIG=$exe`n",
              (New-Object System.Text.UTF8Encoding($false)))
            Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
            # Do not fail this step: the next step exports PKG_CONFIG itself,
            # so the build can still proceed if extraction failed.
            exit 0
          } else {
            Write-Host "::error::pkg-config.exe not found after extraction; the msys2-runtime 3.5.4-2 download will 404"
            exit 0
          }


      # ---- DETERMINISTIC fix for the dead msys2-runtime entry ----------------
      # Two -XX problems, both upstream, both inside vcpkg's own package table at
      # VCPKG_COMMIT_ID:
      #
      # 1. The entry points at
      #      msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst
      #    which no longer exists on ANY of the six msys2 mirrors (verified: the
      #    only surviving runtimes are 3.4-3.4.10-5 and 3.6.x).
      #
      # 2. Even after repointing the URL, vcpkg DERIVES the package name from the
      #    filename with
      #      ([^/]*)-[^-/]+-[^-/]+-[^-/]+\.pkg\.tar\.(xz|zst)
      #    and takes group 2. For "msys2-runtime-3.5.4-2-..." that yields
      #    "msys2-runtime" (correct), but "3.4" has no dash, so
      #    "msys2-runtime-3.4-3.4.10-5-..." yields "msys2-runtime-3.4".
      #    The name "msys2-runtime" then vanishes and vcpkg aborts with
      #      Unknown packages were required for ... : msys2-runtime
      #    which is exactly the failure seen in the last run.
      #
      # Fix both: repoint to a runtime that still downloads, AND pass the name
      # explicitly. The declaration helper honours it:
      #      if(NOT DEFINED arg_NAME) set(arg_NAME "${CMAKE_MATCH_2}") endif()
      # so an explicit NAME is never overwritten by the derived value.
      # URL and SHA512 must change together (vcpkg verifies the download).
      - name: Repoint vcpkg's dead msys2-runtime entry
        shell: bash
        continue-on-error: true
        run: |
          set -u
          F="/c/vcpkg/scripts/cmake/vcpkg_acquire_msys.cmake"
          if [ ! -f "$F" ]; then
            echo "::warning::$F missing; relying on the PKG_CONFIG path only"
            exit 0
          fi
          BASE="https://mirror.msys2.org/msys/x86_64"
          OLD="msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst"
          NEW="msys2-runtime-3.4-3.4.10-5-x86_64.pkg.tar.zst"
          OLD_SHA="070aeb43385beb0e3f8d5fb28909469765116c222d53c2614f5f080be879eef0b78258334b35e8cda7625d8704efc89133f8b8fa78f309c5d680ae270efdaba8"
          NEW_SHA="069fa1be3c7dafc2eb2d6a53af2782ef96eca2456a1e26024f52ec6ce21306bd4640d2caa301e8c6898a7ea85781ed67505c1f17cffc4e2f5114114047e4c10f"
          # Feature-delivered runtimes live in the alternative 3.4 branch; skip if
          # someone already selected it.
          if grep -q "$NEW" "$F"; then
            echo "runtime URL already repointed"
          elif ! grep -q "$OLD" "$F"; then
            echo "::warning::dead URL not present in $F; vcpkg layout changed, skipping"
            exit 0
          else
            # Checksum FIRST so the URL never sits next to a stale hash.
            sed -i "s|$OLD_SHA|$NEW_SHA|g" "$F"
            sed -i "s|$OLD|$NEW|g" "$F"
            echo "repointed runtime URL to $NEW"
          fi
          # Pin the package name. Nested sed/grep quoting is fragile, so use a
          # tiny python edit instead: idempotent, and it reports what it did.
          python - "$F" "$BASE/$NEW" <<'PY'
          import io, sys
          path, url = sys.argv[1], sys.argv[2]
          src = io.open(path, encoding="utf-8", errors="replace").read()
          pinned = 'NAME msys2-runtime URL "%s"' % url
          plain = 'URL "%s"' % url
          if pinned in src:
              print("package name already pinned")
          elif plain not in src:
              print("::warning::target declaration not found; nothing to pin")
          else:
              src = src.replace("declare_package( " + plain,
                                "declare_package( NAME msys2-runtime " + plain)
              io.open(path, "w", encoding="utf-8", newline="\n").write(src)
              print("pinned package name to msys2-runtime")
          PY
          echo "--- resulting msys2-runtime entries ---"
          grep -n "msys2-runtime-3" "$F" || true
          echo "--- verification ---"
          if grep -q "$OLD" "$F"; then
            echo "::error::dead URL still present after patch"
            exit 1
          fi
          if ! grep -q "$NEW_SHA" "$F"; then
            echo "::error::new checksum was not applied"
            exit 1
          fi
          if ! grep -q "NAME msys2-runtime" "$F"; then
            echo "::error::package name was not pinned; vcpkg will report msys2-runtime as unknown"
            exit 1
          fi
          echo "msys2-runtime repointed + name pinned; aom pkgconfig fixup should now proceed"


      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          # Capture FULL output. vcpkg prints CMake failures to stdout, and its
          # per-port logs live in buildtrees/<port>/<triplet>-rel/ (a subdirectory),
          # so the earlier "find -maxdepth 1" matched nothing and the real error
          # never appeared.
          #
          # No `set -o pipefail` here: `... 2>&1 | tee` would make the pipeline
          # report the exit status of tee, masking the real success of vcpkg.
          # ---- pkg-config must be exported HERE, in the same step ----
          # The failure trace
          #   vcpkg_acquire_msys.cmake:212 -> vcpkg_find_acquire_program(PKGCONFIG).cmake:52
          # is only reachable when ENV{PKG_CONFIG} is undefined, so the earlier
          # step's GITHUB_ENV write did not reach this process. Exporting in this
          # same shell guarantees inheritance by vcpkg.
          # Use a forward-slash Windows path: this is Git Bash, but the consumer
          # is native CMake, which cannot execute "/c/..." POSIX paths.
          PKGCONF_EXE="C:/pkgconf/mingw64/bin/pkg-config.exe"
          if [ -f "$PKGCONF_EXE" ] && "$PKGCONF_EXE" --version >/dev/null 2>&1; then
            export PKG_CONFIG="$PKGCONF_EXE"
            echo "pkg-config for vcpkg: $PKG_CONFIG (version $("$PKGCONF_EXE" --version))"
          else
            echo "::warning::pkg-config not runnable here; relying on the patched msys2-runtime URL"
          fi

          LOG=/tmp/vcpkg-install.log
          $VCPKG_ROOT/vcpkg install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "============= BUILD FAILED (exit $rc) ============="
            echo "----- error lines from install output -----"
            grep -nEi "CMake Error|error C[0-9]+|error LNK|error MSB|BUILD_FAILED|failed with|Unsupported nasm|No space left|No such file" "$LOG" \
              | head -n 50 || true
            echo "----- per-port logs (recursive, CMakeCache excluded) -----"
            for p in aom ffmpeg libvpx opus libyuv libjpeg-turbo; do
              d="${VCPKG_ROOT}/buildtrees/${p}"
              [ -d "$d" ] || continue
              echo "##### ${p} #####"
              find "$d" -type f \( -name "*.log" -o -name "*.txt" \) 2>/dev/null \
                | grep -vi CMakeCache | while read -r f; do
                    echo "--- ${f#${VCPKG_ROOT}/buildtrees/} (last 40) ---"
                    tail -n 40 "$f"
                  done
            done
            echo "----- end -----"
            # Persist everything for download: the workflow log gets truncated, so the
            # operator would otherwise have to hand-copy thousands of lines.
            # Tar the whole buildtrees subtree (minus the huge CMakeCache files)
            # instead of `cp --parents`, whose behaviour differs on Git Bash.
            mkdir -p "${GITHUB_WORKSPACE}/vcpkg-failure-logs"
            cp "$LOG" "${GITHUB_WORKSPACE}/vcpkg-failure-logs/install.log" 2>/dev/null || true
            if [ -d "${VCPKG_ROOT}/buildtrees" ]; then
              tar -czf "${GITHUB_WORKSPACE}/vcpkg-failure-logs/buildtrees-logs.tgz" \
                --exclude='CMakeCache.txt' \
                --exclude='*.o' --exclude='*.obj' \
                -C "${VCPKG_ROOT}" buildtrees 2>/dev/null \
                || echo "::warning::could not archive buildtrees logs"
            fi
            # Also keep the small, most relevant plain-text logs directly.
            for p in aom ffmpeg libvpx opus libyuv libjpeg-turbo; do
              d="${VCPKG_ROOT}/buildtrees/${p}"
              [ -d "$d" ] || continue
              find "$d" -type f -name "*.log" ! -name "*CMakeCache*" -size -2M 2>/dev/null \
                | while read -r f; do
                    cp "$f" "${GITHUB_WORKSPACE}/vcpkg-failure-logs/${p}-$(basename "$f")" 2>/dev/null || true
                  done
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      # Only upload when the collector actually produced something. `if: failure()`
      # alone fires for ANY earlier failure, including ones that never reached the
      # vcpkg step -- which produced the noisy
      # "No files were found with the provided path: vcpkg-failure-logs/".
      - name: Upload vcpkg failure logs
        if: ${{ failure() && hashFiles('vcpkg-failure-logs/**') != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-failure-logs
          path: vcpkg-failure-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: icon stuff
        if: ${{ inputs.iconlink != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          mv ./res/icon.ico ./res/icon.ico.bak
          mv ./res/icon.png ./res/icon.png.bak
          mv ./res/tray-icon.ico ./res/tray-icon.ico.bak

      - name: magick stuff
        if: ${{ inputs.iconlink != 'false' }}
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri ${{ fromJson(inputs.iconlink).url }}/get_png?filename=${{ fromJson(inputs.iconlink).file }}"&"uuid=${{ fromJson(inputs.iconlink).uuid }} -OutFile ./res/icon.png 
          mv ./res/32x32.png ./res/32x32.png.bak
          mv ./res/64x64.png ./res/64x64.png.bak
          mv ./res/128x128.png ./res/128x128.png.bak
          mv ./res/128x128@2x.png ./res/128x128@2x.png.bak
          magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
          cp ./res/icon.ico ./res/tray-icon.ico
          magick ./res/icon.png -resize 32x32 ./res/32x32.png
          magick ./res/icon.png -resize 64x64 ./res/64x64.png
          magick ./res/icon.png -resize 128x128 ./res/128x128.png
          magick ./res/128x128.png -resize 200% ./res/128x128@2x.png

      - name: ui.rs icon
        if: ${{ inputs.iconlink != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          cp ./src/ui.rs ./src/ui.rs.bak
          b64=$(base64 < ./res/icon.png)
          sed -i -e 's||$(echo "$b64")|' ./src/ui.rs
          b64=""

      - name: fix connection delay
        continue-on-error: true
        if: ${{ fromJson(inputs.extras).delayFix == 'true' }}
        shell: bash
        run: |
          sed -i -e '/if !key.is_empty() && !token.is_empty() {/,/}/d' ./src/client.rs

      - name: add cycle monitors to toolbar
        continue-on-error: true
        if: fromJson(inputs.extras).cycleMonitor == 'true'
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/cycle_monitor.diff -OutFile cycle_monitor.diff
          git apply cycle_monitor.diff

      - name: use X for offline display instead of orange circle
        continue-on-error: true
        if: fromJson(inputs.extras).xOffline == 'true'
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/xoffline.diff -OutFile xoffline.diff
          git apply xoffline.diff

      - name: hide-cm
        continue-on-error: true
        if: fromJson(inputs.extras).hidecm == 'true'
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/hidecm.diff -OutFile hidecm.diff
          git apply hidecm.diff

      - name: removeNewVersionNotif
        continue-on-error: true
        if: fromJson(inputs.extras).removeNewVersionNotif == 'true'
        shell: bash
        run: | 
          sed -i -e 's|updateUrl.isNotEmpty|false|' ./flutter/lib/desktop/pages/desktop_home_page.dart

      - name: run as admin
        continue-on-error: true
        if: ${{ fromJson(inputs.extras).runasadmin == 'true' }}
        shell: bash
        run: |
          echo "SET_TARGET_PROPERTIES(\${BINARY_NAME} PROPERTIES LINK_FLAGS    \"/MANIFESTUAC:\\\"level='requireAdministrator' uiAccess='false'\\\" /SUBSYSTEM:WINDOWS\")" >> ./flutter/windows/runner/CMakeLists.txt
          sed -i '/administrator/d' res/manifest.xml

      - name: Report Status (25% complete)
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="25% complete"
          # inline JSON (no python): only " and \ need escaping here
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"

      - name: replace flutter icons
        if: ${{ inputs.iconlink != 'false' }}
        continue-on-error: true
        run: |
          cd ./flutter
          #flutter pub upgrade win32
          flutter pub get
          flutter pub run flutter_launcher_icons
          cd ..

      - name: Report Status (50% complete, this step takes about 5 minutes, be patient.)
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="50% complete, this step takes about 5 minutes, be patient."
          # inline JSON (no python): only " and \ need escaping here
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"

      - name: Build rustdesk
        run: |
          # Windows: build RustDesk
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
 
          # Download usbmmidd_v2.zip and extract it to ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk   

          # Download printer driver files and extract them to ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4.zip -OutFile rustdesk_printer_driver_v4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
 
            # Check and move the files
            $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4\.zip$').Matches.Groups[1].Value
            $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4.zip -Algorithm SHA256
            $checksum_dll = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            $downloadsum_dll = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
            if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_dll -eq $downloadsum_dll.Hash) {
                Write-Output "rustdesk_printer_driver_v4, checksums match, extract the file."
                Expand-Archive rustdesk_printer_driver_v4.zip -DestinationPath .
                mkdir ./rustdesk/drivers
                mv -Force .\rustdesk_printer_driver_v4 ./rustdesk/drivers/RustDeskPrinterDriver
                Expand-Archive printer_driver_adapter.zip -DestinationPath .
                mv -Force .\printer_driver_adapter.dll ./rustdesk
            } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
                Write-Output "rustdesk_printer_driver_v4, checksums do not match, ignore the file."
            } else {
                Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
            }
          } catch {
              Write-Host "Ingore the printer driver error."
          }

      - name: icon stuff
        if: ${{ inputs.iconlink != 'false' }}
        continue-on-error: true
        run: |
          mv ./rustdesk/data/flutter_assets/assets/icon.svg ./rustdesk/data/flutter_assets/assets/icon.svg.bak
          magick ./res/icon.png ./rustdesk/data/flutter_assets/assets/icon.svg

      - name: logo stuff
        if: ${{ inputs.logolink != 'false' }}
        continue-on-error: true
        run: |
          Invoke-WebRequest -Uri ${{ fromJson(inputs.logolink).url }}/get_png?filename=${{ fromJson(inputs.logolink).file }}"&"uuid=${{ fromJson(inputs.logolink).uuid }} -OutFile ./rustdesk/data/flutter_assets/assets/logo.png

      - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      - name: Report Status (70% complete, this step takes about 5 minutes, be patient.)
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="70% complete, this step takes about 5 minutes, be patient."
          # inline JSON (no python): only " and \ need escaping here
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"
      
      - name: zip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./rustdesk/*.dll, ./rustdesk/*.exe -DestinationPath ./rustdesk/unsigned_files.zip -CompressionLevel Fastest

      - name: sign dlls
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./rustdesk/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./rustdesk/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./rustdesk/unsigned_files.zip ./rustdesk/signed_files.zip
          fi

      - name: unzip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./rustdesk/signed_files.zip -DestinationPath ./rustdesk/ -Force
          Remove-Item ./rustdesk/unsigned_files.zip
          Remove-Item ./rustdesk/signed_files.zip
          

      - name: Create custom.txt file
        shell: bash
        run: |
          echo -n "${{ inputs.custom }}" | cat > ./rustdesk/custom.txt
        

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ inputs.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ inputs.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/rustdesk.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi
        continue-on-error: true
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          $myappname = "${{ inputs.appname }}" -replace '\s','_'
          cp "rustdesk/${{ inputs.appname }}.exe" "rustdesk/${myappname}.exe" -ErrorAction SilentlyContinue
          pushd ./res/msi
          python preprocess.py --app-name "$myappname" --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          cp ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk-latest.msi
          mv ./Package/bin/x64/Release/en-us/Package.msi ../../SignOutput/rustdesk.msi
          sha256sum ../../SignOutput/rustdesk.msi

      - name: Report Status (85% complete)
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="85% complete"
          # inline JSON (no python): only " and \ need escaping here
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"

      - name: zip exe and msi
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive -Path ./SignOutput/*.exe, ./SignOutput/*.msi -DestinationPath ./SignOutput/unsigned_files.zip -CompressionLevel Fastest

      - name: sign exe and msi
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./SignOutput/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./SignOutput/signed_files.zip
          else
            echo "Signing skipped - signing URL or API key not configured"
            cp ./SignOutput/unsigned_files.zip ./SignOutput/signed_files.zip
          fi

      - name: unzip exe and msi
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./SignOutput/signed_files.zip -DestinationPath ./SignOutput/ -Force
          Remove-Item ./SignOutput/unsigned_files.zip
          Remove-Item ./SignOutput/signed_files.zip

      - name: rename rustdesk.exe to filename.exe
        run: |
          mv ./SignOutput/rustdesk.exe "./SignOutput/${{ inputs.filename }}.exe" || echo "rustdesk"

      - name: rename rustdesk.msi to filename.msi
        continue-on-error: true
        run: |
          mv ./SignOutput/rustdesk.msi "./SignOutput/${{ inputs.filename }}.msi" || echo "rustdesk"

      - name: send file to rdgen server
        if: ${{ fromJson(inputs.extras).rdgen == 'true' }}
        shell: bash
        run: |
          curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ secrets.CALLBACK_TOKEN }}" -F "file=@./SignOutput/${{ inputs.filename }}.exe" -F "uuid=${{ inputs.uuid }}" ${{ secrets.GENURL }}/save_custom_client
          curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ secrets.CALLBACK_TOKEN }}" -F "file=@./SignOutput/${{ inputs.filename }}.msi" -F "uuid=${{ inputs.uuid }}" ${{ secrets.GENURL }}/save_custom_client || true

      - name: send file to api server
        if: ${{ fromJson(inputs.extras).rdgen == 'false' }}
        shell: bash
        run: |
          curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ secrets.CALLBACK_TOKEN }}" -F "file=@./SignOutput/${{ inputs.filename }}.exe" ${{ inputs.apiServer }}/api/save_custom_client
          curl -i -X POST -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${{ secrets.CALLBACK_TOKEN }}" -F "file=@./SignOutput/${{ inputs.filename }}.msi" ${{ inputs.apiServer }}/api/save_custom_client || true

      - name: Upload artifacts to File Browser
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          FB_URL_S: ${{ secrets.FB_URL }}
          FB_USER_S: ${{ secrets.FB_USER }}
          FB_PASS_S: ${{ secrets.FB_PASS }}
          FB_DIR_S: ${{ vars.FB_DIR }}
        run: |
          [ -n "${FB_URL_S:-}" ] || { echo "FB_URL not set, skip"; exit 0; }
          BASE="${FB_URL_S%/}"
          TOKEN=$(curl -fsS -X POST "$BASE/api/login" -H 'Content-Type: application/json' \
            -d "{\"username\":\"$FB_USER_S\",\"password\":\"$FB_PASS_S\"}" \
            | sed -n 's/.*"token"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          if [ -z "${TOKEN:-}" ]; then echo "::error::File Browser login failed"; exit 1; fi
          DIR="${FB_DIR_S:-/Software/RustDesk}"
          ok=0; bad=0
          for f in \
            "./SignOutput/${{ inputs.filename }}.exe" \
            "./SignOutput/${{ inputs.filename }}.msi" \
          ; do
            [ -f "$f" ] || { echo "skip (missing): $f"; continue; }
            N=$(basename "$f")
            c=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              "$BASE/api/resources${DIR}%2F${N}?override=true" \
              -H "X-Auth: $TOKEN" -H "X-Forwarded-For: 127.0.0.1" \
              --connect-timeout 15 --max-time 300 --retry 1 --retry-delay 5 \
              -F "file=@${f}" 2>/dev/null || echo 000)
            echo "upload $N -> $c"
            case "$c" in 200|201) ok=$((ok+1));; *) bad=$((bad+1)); echo "::warning::$N HTTP $c";; esac
          done
          echo "mirror summary: $ok uploaded, $bad failed"
      - name: Report Status (Success)
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="Success"
          # inline JSON (no python): only " and \ need escaping here
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"

      - name: Report failed status
        if: failure()
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="Generation failed, try again"
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"

      - name: Report cancelled status
        if: cancelled()
        shell: bash
        continue-on-error: true
        env:
          SU: ${{ env.STATUS_URL }}
          TK: ${{ secrets.CALLBACK_TOKEN }}
          ID: ${{ inputs.uuid }}
        run: |
          [ -n "${SU:-}" ] || { echo "no status url, skip"; exit 0; }
          ST="Generation cancelled, try again"
          ESC=$(printf '%s' "$ST" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
          BODY=$(printf '{"uuid":"%s","status":"%s"}' "$ID" "$ESC")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SU" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${TK:-}" \
            --connect-timeout 5 --max-time 8 --retry 1 --retry-delay 2 \
            -d "$BODY" 2>/dev/null || echo 000)
          echo "status->$code ($ST)"
          [ "$code" = "200" ] || echo "::warning::status report HTTP $code"
