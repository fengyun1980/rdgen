name: Custom Windows Client Generator
run-name: Custom Windows Client Generator · ${{ inputs.appname }} (${{ fromJson(inputs.extras).version }})
true:
  workflow_dispatch:
    inputs:
      server:
        description: Rendezvous Server
        required: true
        default: ''
        type: string
      key:
        description: Public Key
        required: true
        default: ''
        type: string
      apiServer:
        description: API Server
        required: true
        default: ''
        type: string
      custom:
        description: Custom JSON (base64)
        required: true
        default: ''
        type: string
      uuid:
        description: uuid of request
        required: true
        default: ''
        type: string
      iconlink:
        description: icon link
        required: false
        default: 'false'
        type: string
      logolink:
        description: logo link
        required: false
        default: 'false'
        type: string
      appname:
        description: app name
        required: true
        default: rustdesk
        type: string
      filename:
        description: Filename
        required: true
        default: rustdesk
        type: string
      extras:
        description: extra inputs in json
        required: true
        default: '{}'
        type: string
permissions:
  contents: read
concurrency:
  group: rdgen-${{ inputs.uuid }}
  cancel-in-progress: false
env:
  GENURL: ${{ secrets.GENURL }}
  CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
  FB_URL: ${{ secrets.FB_URL }}
  FB_USER: ${{ secrets.FB_USER }}
  FB_PASS: ${{ secrets.FB_PASS }}
  FB_DIR: ${{ vars.FB_DIR }}
  API_SERVER: ${{ inputs.apiServer }}
jobs:
  bridge:
    name: Prepare shared bridge artifacts
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ fromJson(inputs.extras).version }}
  helper:
    name: Build RustDeskTempTopMostWindow
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
  build:
    name: Custom Windows Client Generator
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          vcpkg-triplet: x64-windows-static
    steps:
    - name: Load rdgen action definitions
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}
        path: .rdgen
        sparse-checkout: .github/actions .github/patches
        sparse-checkout-cone-mode: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@v6
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          '
    - name: Set rdgen value
      if: ${{ fromJson(inputs.extras).rdgen == 'true' }}
      run: 'echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $env:GITHUB_ENV

        '
    - name: Set rdgen value
      if: ${{ fromJson(inputs.extras).rdgen == 'false' }}
      run: 'echo "STATUS_URL=${{ inputs.apiServer }}/api/updategh" >> $env:GITHUB_ENV

        '
    - name: Building · 5%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '5'
        label: Building
      continue-on-error: true
    - name: Checkout source code
      if: ${{ env.VERSION != 'master' }}
      uses: actions/checkout@v4
      with:
        repository: rustdesk/rustdesk
        ref: refs/tags/${{ env.VERSION }}
        submodules: recursive
    - name: Checkout source code
      if: ${{ env.VERSION == 'master' }}
      uses: actions/checkout@v4
      with:
        repository: rustdesk/rustdesk
        submodules: recursive
    - name: Restore bridge files
      uses: actions/download-artifact@v4
      with:
        name: bridge-artifact
        path: ./
    - name: Install ImageMagick on Windows
      run: 'choco install -y imagemagick.app --no-progress

        Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

        '
    - name: fix flutter_gpu_texture_renderer (fixed in master rustdesk)
      shell: bash
      run: 'sed -i -e ''s|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|'' ./flutter/pubspec.lock

        sed -i -e ''s|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|'' ./flutter/pubspec.yaml

        '
    - name: change appname to custom
      if: inputs.appname != 'rustdesk'
      continue-on-error: true
      shell: bash
      run: '# ./Cargo.toml

        sed -i -e ''s|description = "RustDesk Remote Desktop"|description = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|ProductName = "RustDesk"|ProductName = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ inputs.appname }}"|'' ./Cargo.toml

        sed -i -e ''s|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ inputs.appname }}.exe"|'' ./Cargo.toml

        # ./libs/portable/Cargo.toml

        sed -i -e ''s|description = "RustDesk Remote Desktop"|description = "${{ inputs.appname }}"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|ProductName = "RustDesk"|ProductName = "${{ inputs.appname }}"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ inputs.appname }}"|'' ./libs/portable/Cargo.toml

        sed -i -e ''s|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ inputs.appname }}.exe"|'' ./libs/portable/Cargo.toml

        # ./flutter/windows/runner/Runner.rc

        sed -i -e ''s|"RustDesk Remote Desktop"|"${{ inputs.appname }}"|'' ./flutter/windows/runner/Runner.rc

        sed -i -e ''s|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ inputs.appname }}" "\0"|'' ./flutter/windows/runner/Runner.rc

        sed -i -e ''s|"rustdesk.exe"|"${{ inputs.filename }}"|'' ./flutter/windows/runner/Runner.rc

        sed -i -e ''s|"RustDesk"|"${{ inputs.appname }}"|'' ./flutter/windows/runner/Runner.rc

        # ./src/lang/en.rs

        find ./src/lang -name "*.rs" -exec sed -i -e ''s|RustDesk|${{ inputs.appname }}|'' {} \;

        '
    - name: change company name
      if: fromJson(inputs.extras).compname != 'Purslane Ltd'
      continue-on-error: true
      shell: bash
      run: "sed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart\nsed -i -e 's|Purslane Ltd.|${{ fromJson(inputs.extras).compname }}|' ./res/setup.nsi\nsed -i -e 's|PURSLANE|${{ fromJson(inputs.extras).compname }}|' ./res/msi/preprocess.py\nsed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./res/msi/preprocess.py\nsed -i -e 's|\"Copyright © 2025 Purslane Ltd. All rights reserved.\"|\"Copyright © 2025 ${{ fromJson(inputs.extras).compname }}. All rights reserved.\"|' ./flutter/windows/runner/Runner.rc\nsed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./flutter/windows/runner/Runner.rc\nsed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./Cargo.toml\nsed -i -e 's|Purslane Ltd|${{ fromJson(inputs.extras).compname }}|' ./libs/portable/Cargo.toml\n   \n"
    - name: change url to custom
      if: fromJson(inputs.extras).urlLink != 'https://rustdesk.com'
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|Homepage: https://rustdesk.com|Homepage: ${{ fromJson(inputs.extras).urlLink }}|'' ./build.py

        sed -i -e "s|launchUrl(Uri.parse(''https://rustdesk.com''));|launchUrl(Uri.parse(''${{ fromJson(inputs.extras).urlLink }}''));|" ./flutter/lib/common.dart

        sed -i -e "s|launchUrlString(''https://rustdesk.com'');|launchUrlString(''${{ fromJson(inputs.extras).urlLink }}'');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart

        sed -i -e "s|launchUrlString(''https://rustdesk.com/privacy.html'')|launchUrlString(''${{ fromJson(inputs.extras).urlLink }}/privacy.html'')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart

        sed -i -e "s|const url = ''https://rustdesk.com/'';|const url = ''${{ fromJson(inputs.extras).urlLink }}'';|" ./flutter/lib/mobile/pages/settings_page.dart

        sed -i -e "s|launchUrlString(''https://rustdesk.com/privacy.html'')|launchUrlString(''${{ fromJson(inputs.extras).urlLink }}/privacy.html'')|" ./flutter/lib/mobile/pages/settings_page.dart

        sed -i -e "s|https://rustdesk.com/privacy.html|${{ fromJson(inputs.extras).urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart

        sed -i -e "s|https://rustdesk.com/|${{fromJson(inputs.extras).urlLink }}|" ./res/setup.nsi

        '
    - name: change download link to custom
      if: fromJson(inputs.extras).downloadLink != 'https://rustdesk.com/download'
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|'' ./flutter/lib/desktop/pages/desktop_home_page.dart

        sed -i -e ''s|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|'' ./flutter/lib/mobile/pages/connection_page.dart

        sed -i -e ''s|https://rustdesk.com/download|${{ fromJson(inputs.extras).downloadLink }}|'' ./src/ui/index.tis

        '
    - name: set server, key, and apiserver
      continue-on-error: true
      shell: bash
      run: 'sed -i -e ''s|rs-ny.rustdesk.com|${{ inputs.server }}|'' ./libs/hbb_common/src/config.rs

        sed -i -e ''s|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ inputs.key }}|'' ./libs/hbb_common/src/config.rs

        sed -i -e ''s|https://admin.rustdesk.com|${{ inputs.apiServer }}|'' ./src/common.rs

        # ./flutter/pubspec.yaml

        #sed -i ''/intl:/a \ \ archive: ^3.6.1'' ./flutter/pubspec.yaml

        '
    - name: allow custom.txt
      continue-on-error: true
      run: 'Invoke-WebRequest -Uri ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/allowCustom.diff -OutFile allowCustom.diff

        git apply allowCustom.diff

        Invoke-WebRequest -Uri ${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/.github/patches/removeSetupServerTip.diff -OutFile removeSetupServerTip.diff

        git apply removeSetupServerTip.diff

        '
    - name: Pre-seed LLVM installer (GitHub Releases returns intermittent 504)
      id: llvm_seed
      shell: pwsh
      continue-on-error: true
      env:
        LLVM_VER: ${{ env.LLVM_VERSION }}
      run: "$ErrorActionPreference = 'Stop'\n$dest = \"C:\\llvm-installer\\LLVM-$env:LLVM_VER-win64.exe\"\n$url  = \"https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VER/LLVM-$env:LLVM_VER-win64.exe\"\nNew-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null\n\"downloaded=false\" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8\n\nif ((Test-Path $dest) -and ((Get-Item $dest).Length -gt 100MB)) {\n  Write-Host \"already present: $dest\"\n  \"downloaded=true\" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8\n  exit 0\n}\n\n$attempt = 0\n$delay = 5\nwhile ($attempt -lt 10) {\n  $attempt++\n  Write-Host \"attempt $attempt/10 -> $url\"\n  try {\n    # -UseBasicParsing keeps this working on older PS without IE engine\n    Invoke-WebRequest -Uri $url -OutFile \"$dest.part\" -UseBasicParsing -TimeoutSec 1800\n    if ((Test-Path \"$dest.part\") -and ((Get-Item \"$dest.part\").Length -gt 100MB)) {\n      Move-Item -Force \"$dest.part\" $dest\n      Write-Host (\"downloaded ok: {0:N1} MB\" -f ((Get-Item $dest).Length/1MB))\n      \"downloaded=true\" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8\n      exit 0\n    }\n    Write-Host \"  too small, discarding\"\n    Remove-Item -Force \"$dest.part\" -ErrorAction SilentlyContinue\n  } catch {\n    Write-Host \"  download failed: $($_.Exception.Message)\"\n    Remove-Item -Force \"$dest.part\" -ErrorAction SilentlyContinue\n  }\n  if ($attempt -lt 10) {\n    Write-Host \"  waiting ${delay}s\"\n    Start-Sleep -Seconds $delay\n    $delay = [Math]::Min($delay * 2, 60)\n  }\n}\nWrite-Host \"::warning::LLVM pre-seed failed after 10 attempts; the fallback action will retry\"\nexit 0\n"
    - name: Install LLVM from pre-seeded installer
      if: ${{ steps.llvm_seed.outputs.downloaded == 'true' }}
      shell: pwsh
      run: '$exe = "C:\llvm-installer\LLVM-${{ env.LLVM_VERSION }}-win64.exe"

        Write-Host "Installing from $exe"

        # Silent install (the upstream distribution is an NSIS installer).

        Start-Process -FilePath $exe -ArgumentList ''/S'',''/D=C:\Program Files\LLVM'' -Wait

        "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

        & "C:\Program Files\LLVM\bin\clang.exe" --version

        '
    - name: Install LLVM and Clang (fallback)
      if: ${{ steps.llvm_seed.outputs.downloaded != 'true' }}
      uses: KyleMayes/install-llvm-action@v1
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Building · 10%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '10'
        label: Building
      continue-on-error: true
    - name: Install flutter
      uses: subosito/flutter-action@v2.12.0
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Replace engine with rustdesk custom flutter engine
      run: 'flutter doctor -v

        flutter precache --windows

        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip

        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release

        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

        '
    - name: Patch flutter
      continue-on-error: true
      shell: bash
      run: 'cp .rdgen/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))

        cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - name: Building · 15%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '15'
        label: Building
      continue-on-error: true
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Building · 20%
      uses: ./.rdgen/.github/actions/notify
      with:
        uuid: ${{ inputs.uuid }}
        percent: '20'
        label: Building
      continue-on-error: true
    - name: Pre-seed vcpkg.exe (bootstrap download returns intermittent 504)
      shell: pwsh
      continue-on-error: true
      run: "$ErrorActionPreference = 'Continue'\n$dest = \"C:\\vcpkg\\vcpkg.exe\"\n$url  = \"https://github.com/microsoft/vcpkg-tool/releases/download/2025-03-22/vcpkg.exe\"\nNew-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null\nif ((Test-Path $dest) -and ((Get-Item $dest).Length -gt 1MB)) {\n  Write-Host \"already present: $dest\"\n  exit 0\n}\n$attempt = 0\n$delay = 5\nwhile ($attempt -lt 10) {\n  $attempt++\n  Write-Host \"attempt $attempt/10 -> $url\"\n  try {\n    Invoke-WebRequest -Uri $url -OutFile \"$dest.part\" -UseBasicParsing -TimeoutSec 300\n    if ((Test-Path \"$dest.part\") -and ((Get-Item \"$dest.part\").Length -gt 1MB)) {\n      Move-Item -Force \"$dest.part\" $dest\n      Write-Host (\"seeded vcpkg.exe: {0:N1} MB\" -f ((Get-Item $dest).Length/1MB))\n      exit 0\n    }\n    Remove-Item -Force \"$dest.part\" -ErrorAction SilentlyContinue\n  } catch {\n    Write-Host \"  failed: $($_.Exception.Message)\"\n    Remove-Item -Force \"$dest.part\" -ErrorAction SilentlyContinue\n  }\n  if ($attempt -lt 10) { Start-Sleep -Seconds $delay; $delay = [Math]::Min($delay * 2, 60) }\n}\nWrite-Host \"::warning::vcpkg.exe pre-seed failed; bootstrap will download it itself\"\nexit 0\n"
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Restore NASM archive from cache
      id: nasm-cache
      uses: actions/cache@v4
      with:
        path: C:\vcpkg\downloads\nasm-2.16.03-win64.zip
        key: nasm-2.16.03-win64.zip-v1
    - name: Pre-seed NASM into vcpkg downloads
      if: steps.nasm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: "set -u\nDEST=\"/c/vcpkg/downloads/nasm-2.16.03-win64.zip\"\nmkdir -p /c/vcpkg/downloads\nif [ -s \"$DEST\" ]; then echo \"already present: $DEST\"; exit 0; fi\necho \"Fetching NASM from upstream...\"\n# Non-fatal by design: vcpkg has its own retry logic and prints better\n# diagnostics than we can. Seeding is an optimisation, not a hard need.\nif curl -fSL --retry 5 --retry-delay 5 --retry-all-errors \\\n     --connect-timeout 30 --max-time 300 \\\n     -o \"$DEST.part\" \\\n     \"https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip\"; then\n  # Verify the ZIP magic before publishing: some hosts answer with an\n  # HTML error page carrying HTTP 200, which would poison the cache and\n  # surface later as a confusing unzip failure.\n  if [ \"$(head -c2 \"$DEST.part\")\" = \"PK\" ]; then\n    mv \"$DEST.part\" \"$DEST\"\n    echo \"seeded $(stat -c%s \"$DEST\" 2>/dev/null || wc -c <\"$DEST\") bytes\"\n  else\n    echo \"::warning::downloaded file is not a ZIP (got HTML?); discarding\"\n    rm -f \"$DEST.part\"\n  fi\nelse\n  echo \"::warning::NASM pre-seed failed; vcpkg will try the origin itself\"\n  rm -f \"$DEST.part\"\nfi\n"
    - name: Provide pkg-config (msys2-runtime 3.5.4-2 was rotated out of mirrors)
      shell: pwsh
      continue-on-error: true
      run: "$ErrorActionPreference = 'Continue'\n$root = \"C:\\pkgconf\"\n$pkg  = Join-Path $root \"mingw-w64-x86_64-pkgconf-1~2.3.0-1-any.pkg.tar.zst\"\n# SHA512 published by vcpkg itself in\n# scripts/cmake/vcpkg_find_acquire_program(PKGCONFIG).cmake at\n# VCPKG_COMMIT_ID -- an authoritative source, not a guess.\n$sha512 = \"5373f050060678166968e09a4dd8ad30324c5dc37842c3517ebc9eb7be7e09d37d2873ff9dc4831c283556b68a0776f06fa6f91d799020b04282b4a3f378a2c4\"\nNew-Item -ItemType Directory -Force -Path $root | Out-Null\n\n# CRITICAL: mirrors filter on User-Agent. Measured from a cloud IP:\n#   \"vcpkg/<ver>\" -> 200 | \"curl/...\" -> 403 | browser UA -> 403\n# The previous revision sent a browser UA, so EVERY mirror answered\n# 403, the archive was never extracted, the build logged\n# \"pkg-config not runnable here\" then died on the same msys2 404.\n# Impersonate vcpkg: that is the client these mirrors are tuned for.\n$name = \"mingw-w64-x86_64-pkgconf-1~2.3.0-1-any.pkg.tar.zst\"\n$mirrors = @(\n  \"https://mirror.msys2.org/mingw/mingw64/$name\",\n  \"https://repo.msys2.org/mingw/mingw64/$name\",\n  \"https://mirror.yandex.ru/mirrors/msys2/mingw/mingw64/$name\",\n  \"https://mirror.selfnet.de/msys2/mingw/mingw64/$name\"\n)\n$ua = \"vcpkg/2025-03-22-d4dd14112c2026ee57e59f966ecfa3b9137bd143\"\n\nfunction Test-Pkgconf {\n  param($Path)\n  if (-not (Test-Path $Path)) { return $false }\n  if ((Get-Item $Path).Length -lt 50000) { return $false }\n  $actual = (Get-FileHash -Path $Path -Algorithm SHA512).Hash.ToLower()\n  return ($actual -eq $sha512)\n}\n\nif (Test-Pkgconf $pkg) {\n  Write-Host \"pkgconf archive already present and verified\"\n} else {\n  Remove-Item $pkg -Force -ErrorAction SilentlyContinue\n  $ok = $false\n  foreach ($url in $mirrors) {\n    if ($ok) { break }\n    $h = ([uri]$url).Host\n    foreach ($attempt in 1..2) {\n      try {\n        Invoke-WebRequest -Uri $url -OutFile \"$pkg.part\" -UseBasicParsing `\n          -TimeoutSec 180 -UserAgent $ua -Headers @{ \"Accept\" = \"*/*\" }\n        Move-Item \"$pkg.part\" $pkg -Force\n        if (Test-Pkgconf $pkg) {\n          Write-Host \"pkgconf fetched from $h (SHA512 verified)\"\n          $ok = $true\n          break\n        }\n        Write-Host \"::warning::$h served an archive with the wrong checksum; discarding\"\n        Remove-Item $pkg -Force -ErrorAction SilentlyContinue\n      } catch {\n        $code = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { \"ERR\" }\n        Write-Host \"::warning::$h attempt $attempt failed (HTTP $code)\"\n        Remove-Item \"$pkg.part\" -Force -ErrorAction SilentlyContinue\n        if ($code -eq 404) { break }   # dead path: no point retrying this host\n        Start-Sleep -Seconds 3\n      }\n    }\n  }\n  if (-not $ok) {\n    Write-Host \"::error::no mirror served a valid pkgconf archive; vcpkg will fall back to msys2 (which 404s on msys2-runtime 3.5.4-2)\"\n    exit 0\n  }\n}\n\n# Windows 11 / Server 2022 ship bsdtar as tar.exe, which reads zstd.\nPush-Location $root\ntar -xf $pkg 2>&1 | Out-Null\n$exe = Join-Path $root \"mingw64\\bin\\pkg-config.exe\"\nPop-Location\n\nif (Test-Path $exe) {\n  Write-Host \"pkg-config ready: $exe\"\n  & $exe --version\n  # NOTE: PowerShell 5.1's `Out-File -Encoding utf8` emits a BOM. In\n  # GITHUB_ENV that BOM glues itself to the FIRST variable name, so\n  # \"PKG_CONFIG=x\" silently becomes \"\\uFEFFPKG_CONFIG=x\" and vcpkg\n  # never sees it. Write UTF-8 *without* BOM instead.\n  # The following step ALSO exports PKG_CONFIG inside its own shell,\n  # which is the path that actually matters (see there).\n  [System.IO.File]::AppendAllText(\n    $env:GITHUB_ENV, \"PKG_CONFIG=$exe`n\",\n    (New-Object System.Text.UTF8Encoding($false)))\n  Split-Path $exe | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii\n  # Do not fail this step: the next step exports PKG_CONFIG itself,\n  # so the build can still proceed if extraction failed.\n  exit 0\n} else {\n  Write-Host \"::error::pkg-config.exe not found after extraction; the msys2-runtime 3.5.4-2 download\
        \ will 404\"\n  exit 0\n}\n"
    - name: Repoint vcpkg's dead msys2-runtime entry
      shell: bash
      continue-on-error: true
      run: "set -u\nF=\"/c/vcpkg/scripts/cmake/vcpkg_acquire_msys.cmake\"\nif [ ! -f \"$F\" ]; then\n  echo \"::warning::$F missing; relying on the PKG_CONFIG path only\"\n  exit 0\nfi\npython - \"$F\" <<'PY'\nimport io, sys\n\npath = sys.argv[1]\nsrc = io.open(path, encoding=\"utf-8\", errors=\"replace\").read()\norig = src\n\nSWITCH_OLD = \"if(X_VCPKG_USE_MSYS2_RUNTIME_3.4)\"\nSWITCH_NEW = \"if(TRUE) # forced by CI: the 3.5.4-2 runtime is 404 upstream\"\nOLD_URL = \"msys2-runtime-3.4-3.4.10-2-x86_64.pkg.tar.zst\"\nNEW_URL = \"msys2-runtime-3.4-3.4.10-5-x86_64.pkg.tar.zst\"\nOLD_SHA = \"3fa087d4eb4e260785b81d5b6f4400ec128a83ff940da732bf147dfde457224573fa467e735b63c9a138872f5c9830f3684f824b2aa5d344fb95dfb91632f832\"\nNEW_SHA = \"069fa1be3c7dafc2eb2d6a53af2782ef96eca2456a1e26024f52ec6ce21306bd4640d2caa301e8c6898a7ea85781ed67505c1f17cffc4e2f5114114047e4c10f\"\n\ndef sub(label, old, new, applied_marker):\n    global src\n    if applied_marker in src:\n        print(\"SKIP   \" + label + \" (already applied)\")\n        return\n    if old in src:\n        src = src.replace(old, new)\n        print(\"APPLY  \" + label)\n    else:\n        print(\"SKIP   \" + label + \" (anchor not found)\")\n\n# Select the 3.4 branch, then make its archive valid.\n# The trailing comment on the switched line is idle: CMake treats\n# everything after the first '#' as a comment, so the statement is\n# still exactly `if(TRUE)`.\nsub(\"force 3.4 runtime branch\", SWITCH_OLD, SWITCH_NEW, SWITCH_NEW)\nsub(\"3.4.10-2 -> 3.4.10-5\", OLD_URL, NEW_URL, NEW_URL)\nsub(\"3.4 checksum -> verified 3.4.10-5 hash\", OLD_SHA, NEW_SHA, NEW_SHA)\n\nif src == orig:\n    print(\"NO CHANGE: nothing matched; vcpkg layout may have changed\")\nelse:\n    io.open(path, \"w\", encoding=\"utf-8\", newline=\"\\n\").write(src)\n    print(\"WRITTEN: vcpkg_acquire_msys.cmake updated\")\nPY\n\necho \"--- msys2-runtime entries as they now stand ---\"\ngrep -n \"msys2-runtime-3\" \"$F\" || true\necho \"--- verification (hard failures) ---\"\nif ! grep -q \"if(TRUE) # forced by CI\" \"$F\"; then\n  echo \"::error::the 3.4 runtime branch was not selected\"\n  exit 1\nfi\nif ! grep -q \"msys2-runtime-3.4-3.4.10-5-x86_64.pkg.tar.zst\" \"$F\"; then\n  echo \"::error::3.4.10-5 runtime URL not present\"\n  exit 1\nfi\nif grep -q \"3fa087d4eb4e260785b81d5b6f4400ec128a83ff940da732bf147dfde457224573fa467e735b63c9a138872f5c9830f3684f824b2aa5d344fb95dfb91632f832\" \"$F\"; then\n  echo \"::error::stale 3.4.10-2 checksum still present\"\n  exit 1\nfi\nif ! grep -q \"069fa1be3c7dafc2eb2d6a53af2782ef96eca2456a1e26024f52ec6ce21306bd4640d2caa301e8c6898a7ea85781ed67505c1f17cffc4e2f5114114047e4c10f\" \"$F\"; then\n  echo \"::error::verified 3.4.10-5 checksum not applied\"\n  exit 1\nfi\n# The 3.4 declaration must still carry the alias vcpkg looks up.\nif ! grep -q \"PROVIDES msys2-runtime\" \"$F\"; then\n  echo \"::error::PROVIDES msys2-runtime vanished; package name would be unresolvable\"\n  exit 1\nfi\necho \"OK: 3.4 runtime branch selected, archive valid, alias intact\"\n"
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: "# Capture FULL output. vcpkg prints CMake failures to stdout, and its\n# per-port logs live in buildtrees/<port>/<triplet>-rel/ (a subdirectory),\n# so the earlier \"find -maxdepth 1\" matched nothing and the real error\n# never appeared.\n#\n# No `set -o pipefail` here: `... 2>&1 | tee` would make the pipeline\n# report the exit status of tee, masking the real success of vcpkg.\n# ---- pkg-config must be exported HERE, in the same step ----\n# The failure trace\n#   vcpkg_acquire_msys.cmake:212 -> vcpkg_find_acquire_program(PKGCONFIG).cmake:52\n# is only reachable when ENV{PKG_CONFIG} is undefined, so the earlier\n# step's GITHUB_ENV write did not reach this process. Exporting in this\n# same shell guarantees inheritance by vcpkg.\n# Use a forward-slash Windows path: this is Git Bash, but the consumer\n# is native CMake, which cannot execute \"/c/...\" POSIX paths.\nPKGCONF_EXE=\"C:/pkgconf/mingw64/bin/pkg-config.exe\"\nif [ -f \"$PKGCONF_EXE\" ] && \"$PKGCONF_EXE\" --version >/dev/null 2>&1; then\n  export PKG_CONFIG=\"$PKGCONF_EXE\"\n  echo \"pkg-config for vcpkg: $PKG_CONFIG (version $(\"$PKGCONF_EXE\" --version))\"\nelse\n  echo \"::warning::pkg-config not runnable here; relying on the patched msys2-runtime URL\"\nfi\n\n# GitHub runs `shell: bash` steps as `bash ... -eo pipefail`.\n# With -e, a failing vcpkg inside the pipeline aborts this script\n# IMMEDIATELY: rc=${PIPESTATUS[0]} never runs, and neither does any\n# diagnostic below it. That is why consecutive runs showed only\n# vcpkg's issue_body.md dump plus a bare 'exit code 1' -- the error\n# extraction was dead code. Disable -e for the build call itself.\nset +e\nLOG=/tmp/vcpkg-install.log\n$VCPKG_ROOT/vcpkg install \\\n  --triplet ${{ matrix.job.vcpkg-triplet }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\" 2>&1 | tee \"$LOG\"\nrc=${PIPESTATUS[0]}\nif [ \"$rc\" -ne 0 ]; then\n  echo \"============= BUILD FAILED (exit $rc) =============\"\n  echo \"----- error lines from install output -----\"\n  grep -nEi \"CMake Error|error C[0-9]+|error LNK|error MSB|BUILD_FAILED|failed with|Unsupported nasm|No space left|No such file\" \"$LOG\" \\\n    | head -n 50 || true\n  echo \"----- per-port logs (recursive, CMakeCache excluded) -----\"\n  for p in aom ffmpeg libvpx opus libyuv libjpeg-turbo; do\n    d=\"${VCPKG_ROOT}/buildtrees/${p}\"\n    [ -d \"$d\" ] || continue\n    echo \"##### ${p} #####\"\n    find \"$d\" -type f \\( -name \"*.log\" -o -name \"*.txt\" \\) 2>/dev/null \\\n      | grep -vi CMakeCache | while read -r f; do\n          echo \"--- ${f#${VCPKG_ROOT}/buildtrees/} (last 40) ---\"\n          tail -n 40 \"$f\"\n        done\n  done\n  echo \"----- end -----\"\n  # Persist everything for download: the workflow log gets truncated, so the\n  # operator would otherwise have to hand-copy thousands of lines.\n  # Tar the whole buildtrees subtree (minus the huge CMakeCache files)\n  # instead of `cp --parents`, whose behaviour differs on Git Bash.\n  mkdir -p \"${GITHUB_WORKSPACE}/vcpkg-failure-logs\"\n  cp \"$LOG\" \"${GITHUB_WORKSPACE}/vcpkg-failure-logs/install.log\" 2>/dev/null || true\n  if [ -d \"${VCPKG_ROOT}/buildtrees\" ]; then\n    tar -czf \"${GITHUB_WORKSPACE}/vcpkg-failure-logs/buildtrees-logs.tgz\" \\\n      --exclude='CMakeCache.txt' \\\n      --exclude='*.o' --exclude='*.obj' \\\n      -C \"${VCPKG_ROOT}\" buildtrees 2>/dev/null \\\n      || echo \"::warning::could not archive buildtrees logs\"\n  fi\n  # Also keep the small, most relevant plain-text logs directly.\n  for p in aom ffmpeg libvpx opus libyuv libjpeg-turbo; do\n    d=\"${VCPKG_ROOT}/buildtrees/${p}\"\n    [ -d \"$d\" ] || continue\n    find \"$d\" -type f -name \"*.log\" ! -name \"*CMakeCache*\" -size -2M 2>/dev/null \\\n      | while read -r f; do\n          cp \"$f\" \"${GITHUB_WORKSPACE}/vcpkg-failure-logs/${p}-$(basename \"$f\")\" 2>/dev/null || true\n        done\n  done\n  # Surface the real cause where the operator actually looks:\n  #   1) ::error:: annotation -> top of the run page, no scrolling\n  #   2) $GITHUB_STEP_SUMMARY -> rendered panel on the run page\n\
        \  # vcpkg prints thousands of lines and its own issue template LAST,\n  # so the genuine first error scrolls far out of view.\n  TOP=$(grep -nEi \"CMake Error|error C[0-9]+|error LNK|error MSB|[Ee]rror:|BUILD_FAILED|failed with|Unsupported nasm|No space left\" \"$LOG\" \\\n        | grep -viE \"issue_body|troubleshoot|learn[.]microsoft\" | head -n 12 || true)\n  PORTHDR=$(grep -nE '^Installing [0-9]+/[0-9]+ ' \"$LOG\" | tail -n 1 || true)\n  {\n    echo '### vcpkg install failed'\n    echo ''\n    echo \"Last package started: ${PORTHDR:-unknown}\"\n    echo ''\n    echo '```'\n    if [ -n \"$TOP\" ]; then echo \"$TOP\"; else echo '(no error pattern matched; see vcpkg-failure-logs artifact)'; fi\n    echo '```'\n  } >> \"$GITHUB_STEP_SUMMARY\"\n  FIRSTERR=$(printf '%s' \"$TOP\" | head -n 3 | tr '\\n' ' ')\n  echo \"::error::vcpkg install failed. First errors: ${FIRSTERR:-see artifact vcpkg-failure-logs}\"\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log\" || true\n"
      shell: bash
