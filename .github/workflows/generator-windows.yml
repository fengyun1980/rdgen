    - name: Collect artifacts
      id: collect
      shell: bash
      run: "set -u\nmkdir -p dist\nfound=0\nfor pat in *.exe *.msi; do\n  for f in $pat; do\n    [ -f \"$f\" ] || continue\n    cp \"$f\" dist/ && found=$((found+1))\n  done\ndone\nif [ \"$found\" -eq 0 ]; then echo \"::error::no artifact matched\"; exit 1; fi\nls -1 dist\n{ echo 'files<<RDGEN_EOF'; (cd dist && ls -1 | sed 's|^|dist/|'); echo 'RDGEN_EOF'; } >> \"$GITHUB_OUTPUT\"\n"
    - name: Deliver artifact
      uses: ./.rdgen/.github/actions/deliver
      with:
